<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trees Pinyin - 学习导航</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f2f0; margin: 0; padding: 40px 20px; text-align: center; }
        .logo { color: #2e7d32; font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        .slogan { color: #666; margin-bottom: 40px; }
        .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 800px; margin: 0 auto; }
        .nav-card { background: white; border-radius: 15px; padding: 30px; text-decoration: none; color: #333; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; border: 1px solid #eee; }
        .nav-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); border-color: #2e7d32; }
        .nav-card h3 { margin: 0 0 10px 0; color: #2e7d32; }
        .nav-card p { margin: 0; color: #888; font-size: 14px; }
        .coming-soon { background: #fafafa; color: #ccc; cursor: default; }
    </style>
</head>
<body>
    <div class="logo">treespinyin</div>
    <div class="slogan">Read Chinese Like English</div>

    <div class="nav-grid">
        <!-- 第一个子页面：Vol.1 -->
        <a href="/vol1/" class="nav-card">
            <h3>Volume 1</h3>
            <p>基础词汇与点读练习<br>(200+ Words & Sentences)</p>
        </a>

        <!-- 预留的未来子页面：Vol.2 -->
        <div class="nav-card coming-soon">
            <h3>Volume 2</h3>
            <p>即将上线 (Coming Soon)</p>
        </div>
        
        <!-- 预留的未来子页面：Vol.3 -->
        <div class="nav-card coming-soon">
            <h3>Volume 3</h3>
            <p>敬请期待</p>
        </div>
    </div>
</body>
</html>

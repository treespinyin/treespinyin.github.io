<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume 1 Vocabulary List</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .back-link {
            color: #888888;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            align-self: flex-start;
        }
        .back-link:hover { color: #ffffff; }
        h1 {
            color: #4CAF50;
            font-size: 32px;
            margin-bottom: 10px;
        }
        .download-link {
            color: #b39ddb;
            text-decoration: none;
            font-size: 16px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .download-link:hover { text-decoration: underline; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 160px;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #4CAF50;
            background-color: #252525;
        }
        .chinese {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .english {
            font-size: 16px;
            color: #aaaaaa;
            font-style: italic;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .audio-btn {
            font-size: 13px;
            color: #888888;
        }
        .card:hover .audio-btn { color: #ffffff; }
    </style>
</head>
<body>

    <a href="../index.html" class="back-link">← Back to Volumes</a>
    <h1>Volume 1 Vocabulary List</h1>
   
<a href="Easy_Mandarin_Speaking_Trees_Pinyin_Book_1.apkg" class="download-link">📩 Download Anki Flashcards Deck</a>
    <div class="grid-container" id="grid"></div>

    <script>
        // CSV 复杂行解析器
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') { inQuotes = !inQuotes; }
                else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                else { current += char; }
            }
            result.push(current.trim());
            return result;
        }

        async function loadCardsFromCSV() {
            try {
                // 加上随机时间戳防止浏览器顽固缓存
                const response = await fetch('words.csv?t=' + new Date().getTime());
                if (!response.ok) {
                    document.getElementById('grid').innerHTML = '<p style="color:red; font-size:18px;">Error: words.csv not found.</p>';
                    return;
                }
                const text = await response.text();
                const lines = text.split(/\r?\n/);
                const grid = document.getElementById('grid');
                
                let audioCounter = 0; // 核心：严格音频计数器

                lines.forEach((line, index) => {
                    if (!line.trim()) return;
                    
                    const parts = parseCSVLine(line);
                    if (parts.length < 2) return;
                    
                    const englishRaw = parts[0].replace(/^"|"$/g, '').trim();
                    const chineseRaw = parts[1].replace(/^"|"$/g, '').trim();

                    // 【智能识别并跳过表头】
                    // 如果第一行的英文里包含 "english" 或 "word" 等字眼，认定为表头，直接跳过不计数
                    if (index === 0 && (englishRaw.toLowerCase().includes('english') || englishRaw.toLowerCase().includes('word'))) {
                        return; 
                    }
                    
                    // 只有通过筛选的有效数据行，音频编号才加 1
                    audioCounter++; 
                    const currentAudioNum = audioCounter; 
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // 闭包绑定当前正确的音频编号
                    card.onclick = () => {
                        const audio = new Audio('audio/' + currentAudioNum + '.mp3');
                        audio.play().catch(err => console.log("Missing audio file:", currentAudioNum, err));
                    };

                    card.innerHTML = `
                        <div class="chinese">${chineseRaw}</div>
                        <div class="english">${englishRaw}</div>
                        <div class="audio-btn">Click to Listen 🔊</div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error(error);
            }
        }

        window.onload = loadCardsFromCSV;
    </script>
</body>
</html>

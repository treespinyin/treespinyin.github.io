<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trees Pinyin - 智能口语与声调评测模块</title>
  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
  <script src="https://unpkg.com/pinyin-pro@3.26.0/dist/index.js"></script>
  <style>
    .tp-tone-wrap {
      font-family: system-ui, -apple-system, sans-serif;
      width: 100%;
      max-width: 660px;
      margin: 24px auto;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
      box-sizing: border-box;
      color: #1e293b;
    }
    .tp-tone-wrap * { box-sizing: border-box; }

    .tp-quota-banner {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 13.5px;
      line-height: 1.55;
      color: #334155;
    }
    .tp-quota-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 6px;
    }
    .tp-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 99px;
      font-weight: 700;
      font-size: 12.5px;
      background: #e0f2fe;
      color: #0369a1;
    }
    .tp-badge.pro { background: #dcfce7; color: #15803d; }
    .tp-badge.exhausted { background: #fee2e2; color: #b91c1c; }

    .tp-actions-links { display: flex; gap: 12px; font-size: 13px; }
    .tp-link-btn {
      background: none;
      border: none;
      color: #2563eb;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
    }
    .tp-link-btn.sub { color: #d97706; }

    .tp-byok-panel {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #cbd5e1;
    }
    .tp-byok-panel.open { display: block; }
    .tp-byok-row { display: flex; gap: 8px; margin-top: 6px; }

    .tp-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }
    .tp-input:focus { border-color: #3b82f6; }

    .tp-stage {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 28px 14px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 14px;
      margin: 16px 0 12px;
      min-height: 135px;
      align-items: center;
    }
    .tp-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 12px;
      border-radius: 10px;
      min-width: 54px;
      background: #f1f5f9;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .tp-err-tag {
      height: 20px;
      font-size: 14px;
      font-weight: 800;
      visibility: hidden;
      margin-bottom: 2px;
      white-space: nowrap;
    }
    .tp-hanzi { font-size: 36px; font-weight: 600; line-height: 1.15; }
    .tp-punct { font-size: 28px; color: #94a3b8; align-self: flex-end; padding-bottom: 6px; }

    /* 国际标准红、黄、绿交通灯配色 */
    /* 绿灯：通过 */
    .tp-item.good {
      background: #dcfce7;
      color: #15803d;
      border-color: #86efac;
    }
    /* 黄灯：声调偏差警告 + 顶部 4→3 */
    .tp-item.warn {
      background: #fef08a;
      color: #a16207;
      border-color: #facc15;
    }
    .tp-item.warn .tp-err-tag {
      visibility: visible;
      color: #b45309;
    }
    /* 红灯：严重错调（如买读成卖，顶部显示 4→3）或读错字/漏读 */
    .tp-item.bad {
      background: #fecaca;
      color: #b91c1c;
      border-color: #f87171;
    }
    .tp-item.bad .tp-err-tag {
      visibility: visible;
      color: #b91c1c;
    }

    /* 麦克风实时音量指示条 */
    .tp-mic-meter-wrap {
      width: 220px;
      height: 6px;
      background: #e2e8f0;
      border-radius: 99px;
      margin: 0 auto 14px;
      overflow: hidden;
      display: none;
    }
    .tp-mic-meter-bar {
      height: 100%;
      width: 0%;
      background: #10b981;
      transition: width 0.08s ease;
    }

    .tp-legend {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 12.5px;
      color: #475569;
      margin-bottom: 16px;
    }
    .tp-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .tp-dot { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }

    .tp-btns { display: flex; justify-content: center; gap: 12px; }
    .tp-btn {
      padding: 10px 24px;
      border-radius: 99px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .tp-btn-rec { background: #10b981; color: #fff; border: none; }
    .tp-btn-rec.on { background: #ef4444; }
    .tp-btn-rec:disabled { background: #94a3b8; cursor: not-allowed; }

    .tp-msg { text-align: center; margin-top: 14px; font-size: 14px; color: #475569; line-height: 1.6; }
    .tp-debug { margin-top: 10px; padding: 8px 12px; background: #f1f5f9; border-radius: 8px; font-size: 13px; color: #475569; text-align: center; display: none; }
  </style>
</head>
<body style="background:#f1f5f9; margin:0; padding:20px 12px;">

<div class="tp-tone-wrap" id="tp-tone-module">

  <!-- 顶部配额说明与商业化横幅 -->
  <div class="tp-quota-banner">
    <div class="tp-quota-top">
      <span class="tp-badge" id="tpQuotaBadge">🎁 今日免费额度：剩余 2 / 2 次</span>
      <div class="tp-actions-links">
        <button class="tp-link-btn" onclick="toggleByokPanel()">⚙️ 添加 Azure Key (免费大量使用)</button>
        <button class="tp-link-btn sub" onclick="openSubscribeModal()">💎 订阅我们的会员</button>
      </div>
    </div>
    <div>
      由于额度限制，每人每天仅允许两次免费评测。您可以<strong>自己添加 Azure Key 免费大量使用</strong>，也可以<strong>订阅我们的会员</strong>。
    </div>

    <div class="tp-byok-panel" id="tpByokPanel">
      <div style="font-size:12px; color:#64748b;">
        填入您的微软 Azure Speech Key（如 Free F0 免费密钥），仅保存在您的浏览器本地，即可无限次免费评测：
      </div>
      <div class="tp-byok-row">
        <input id="tpUserKey" class="tp-input" type="password" placeholder="粘贴您的 Azure KEY 1" oninput="saveByok()" style="flex:2; font-size:13px; padding:7px 10px;" />
        <input id="tpUserRegion" class="tp-input" type="text" placeholder="Region (如 westus2)" oninput="saveByok()" style="flex:1; font-size:13px; padding:7px 10px;" />
        <button class="tp-btn" onclick="clearByok()" style="padding:6px 12px; font-size:12px;">清除</button>
      </div>
    </div>
  </div>

  <!-- 句子输入 -->
  <div>
    <input id="tpTxt" class="tp-input" value="你好，我买了一把雨伞。" oninput="renderSentence()" />
  </div>

  <!-- 汉字舞台 -->
  <div class="tp-stage" id="tpStage"></div>

  <!-- 实时麦克风音量绿条 -->
  <div class="tp-mic-meter-wrap" id="tpMeterWrap">
    <div class="tp-mic-meter-bar" id="tpMeterBar"></div>
  </div>

  <!-- 国际标准红黄绿交通灯图例 -->
  <div class="tp-legend">
    <span><i class="tp-dot" style="background:#22c55e;"></i> 绿灯：读音与声调过关（一声/轻声免检声调）</span>
    <span><i class="tp-dot" style="background:#eab308;"></i> 黄灯 + <b>4→3</b>：声调微偏</span>
    <span><i class="tp-dot" style="background:#ef4444;"></i> 红灯 + <b>4→3</b>：严重错调（如买→卖）或读错字</span>
  </div>

  <!-- 按钮 -->
  <div class="tp-btns">
    <button class="tp-btn" onclick="playDemo()">🔊 示范朗读</button>
    <button class="tp-btn tp-btn-rec" id="tpRecBtn" onclick="toggleEvaluation()">🎤 开始朗读</button>
  </div>

  <div class="tp-msg" id="tpMsg">点击「开始朗读」，读完一整句停顿 1 秒自动出分（或手动点停止）</div>
  <div class="tp-debug" id="tpDbg"></div>
</div>

<script>
  const { pinyin } = window.pinyinPro;

  const WORKER_TOKEN_URL = "/speech-token";
  const DAILY_FREE_LIMIT = 2;

  let targets = [];
  let isRecording = false;
  let recognizer = null;
  let pronWords = [];
  let gotResultPromiseResolve = null;

  let audioCtx = null, micStream = null, meterTimer = null;

  window.addEventListener('DOMContentLoaded', () => {
    const savedKey = localStorage.getItem('tp_az_k') || localStorage.getItem('az_k') || '';
    const savedReg = localStorage.getItem('tp_az_r') || localStorage.getItem('az_r') || 'westus2';
    document.getElementById('tpUserKey').value = savedKey;
    document.getElementById('tpUserRegion').value = savedReg;
    updateQuotaUI();
    renderSentence();
  });

  function toggleByokPanel() {
    document.getElementById('tpByokPanel').classList.toggle('open');
  }

  function openSubscribeModal() {
    alert('💎 Trees Pinyin 会员订阅：\n\n升级会员后无需配置任何 Key，即可每日无限次使用中文发音与声调评测！');
  }

  function saveByok() {
    const k = document.getElementById('tpUserKey').value.trim();
    const r = document.getElementById('tpUserRegion').value.trim();
    localStorage.setItem('tp_az_k', k);
    localStorage.setItem('az_k', k);
    localStorage.setItem('tp_az_r', r);
    localStorage.setItem('az_r', r);
    updateQuotaUI();
  }

  function clearByok() {
    document.getElementById('tpUserKey').value = '';
    localStorage.removeItem('tp_az_k');
    localStorage.removeItem('az_k');
    updateQuotaUI();
  }

  function getTodayStorageKey() {
    const d = new Date();
    return `tp_free_used_${d.getFullYear()}_${d.getMonth()+1}_${d.getDate()}`;
  }

  function getUsedFreeCount() {
    return parseInt(localStorage.getItem(getTodayStorageKey()) || '0', 10);
  }

  function incrementUsedFreeCount() {
    const next = getUsedFreeCount() + 1;
    localStorage.setItem(getTodayStorageKey(), String(next));
    updateQuotaUI();
  }

  function hasCustomKey() {
    return Boolean(document.getElementById('tpUserKey').value.trim() && document.getElementById('tpUserRegion').value.trim());
  }

  function updateQuotaUI() {
    const badge = document.getElementById('tpQuotaBadge');
    const recBtn = document.getElementById('tpRecBtn');

    if (hasCustomKey()) {
      badge.className = 'tp-badge pro';
      badge.textContent = '⚡ 已启用自有 Azure Key：无限免费评测';
      recBtn.disabled = false;
      return;
    }

    const used = getUsedFreeCount();
    const rem = Math.max(0, DAILY_FREE_LIMIT - used);
    if (rem > 0) {
      badge.className = 'tp-badge';
      badge.textContent = `🎁 今日免费额度：剩余 ${rem} / ${DAILY_FREE_LIMIT} 次`;
      recBtn.disabled = false;
    } else {
      badge.className = 'tp-badge exhausted';
      badge.textContent = `🔒 今日免费额度已用完 (0 / ${DAILY_FREE_LIMIT} 次)`;
    }
  }

  function renderSentence() {
    const s = document.getElementById('tpTxt').value.trim();
    const stage = document.getElementById('tpStage');
    stage.innerHTML = '';
    targets = [];
    document.getElementById('tpDbg').style.display = 'none';
    if (!s) return;

    // 获取带上下文变调的拼音与本调拼音
    const pyList = pinyin(s, { type: 'array', toneType: 'num', v: true });
    const origPyList = pinyin(s, { type: 'array', toneType: 'num', v: true, toneSandhi: false });

    Array.from(s).forEach((ch, i) => {
      if (!/[\u4e00-\u9fa5]/.test(ch)) {
        stage.insertAdjacentHTML('beforeend', `<span class="tp-punct">${ch}</span>`);
        return;
      }
      const py = pyList[i] || '';
      const origPy = origPyList[i] || py;
      const t = parseInt((py.match(/([0-5])$/) || [0,1])[1], 10) % 5;
      const origT = parseInt((origPy.match(/([0-5])$/) || [0,1])[1], 10) % 5;
      const base = py.replace(/[0-5]/g, '');
      const idx = targets.length;

      // 规则：一声 (1) 和 轻声 (0) 免检声调！
      const skipToneCheck = (t === 1 || t === 0 || origT === 1 || origT === 0);

      targets.push({ idx, char: ch, base, tone: t, origTone: origT, skipToneCheck });
      stage.insertAdjacentHTML('beforeend', `
        <div class="tp-item" id="tp-c-${idx}">
          <div class="tp-err-tag" id="tp-t-${idx}"></div>
          <div class="tp-hanzi">${ch}</div>
        </div>`);
    });
  }

  function playDemo() {
    const u = new SpeechSynthesisUtterance(document.getElementById('tpTxt').value);
    u.lang = 'zh-CN';
    u.rate = 0.85;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  // 老外声韵母宽容对比（比较 Azure 听到的实际音素与目标音素）
  function normPhoneme(p) {
    if (!p) return '';
    return p.toLowerCase()
      .replace(/[1-5\s]/g, '')
      .replace(/^zh/, 'z').replace(/^ch/, 'c').replace(/^sh/, 's')
      .replace(/ing$/, 'in').replace(/eng$/, 'en').replace(/uang$/, 'uan');
  }

  async function startMicMeter() {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(micStream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      source.connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);
      document.getElementById('tpMeterWrap').style.display = 'block';
      const bar = document.getElementById('tpMeterBar');
      meterTimer = setInterval(() => {
        analyser.getByteFrequencyData(data);
        let sum = 0;
        for (let i = 0; i < data.length; i++) sum += data[i];
        const pct = Math.min(100, Math.round((sum / data.length) * 2.2));
        bar.style.width = pct + '%';
      }, 60);
    } catch (e) {}
  }

  function stopMicMeter() {
    if (meterTimer) { clearInterval(meterTimer); meterTimer = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (audioCtx) { audioCtx.close().catch(()=>{}); audioCtx = null; }
    document.getElementById('tpMeterWrap').style.display = 'none';
    document.getElementById('tpMeterBar').style.width = '0%';
  }

  async function createAzureSpeechConfig() {
    if (hasCustomKey()) {
      const k = document.getElementById('tpUserKey').value.trim();
      const r = document.getElementById('tpUserRegion').value.trim();
      return SpeechSDK.SpeechConfig.fromSubscription(k, r);
    }

    if (getUsedFreeCount() >= DAILY_FREE_LIMIT) {
      document.getElementById('tpByokPanel').classList.add('open');
      throw new Error('由于额度限制，每人每天仅允许两次免费评测。您可以自己添加Azure Key免费大量使用，也可以订阅我们的会员！');
    }

    try {
      const res = await fetch(WORKER_TOKEN_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'speech-token' })
      });
      const data = await res.json();
      if (!res.ok || data.error === 'LIMIT_REACHED') {
        localStorage.setItem(getTodayStorageKey(), String(DAILY_FREE_LIMIT));
        updateQuotaUI();
        document.getElementById('tpByokPanel').classList.add('open');
        throw new Error(data.message || '由于额度限制，每人每天仅允许两次免费评测。');
      }
      if (data.token && data.region) {
        incrementUsedFreeCount();
        return SpeechSDK.SpeechConfig.fromAuthorizationToken(data.token, data.region);
      }
      throw new Error('Token 获取异常');
    } catch (err) {
      if (err.message.includes('每天仅允许两次')) throw err;
      document.getElementById('tpByokPanel').classList.add('open');
      throw new Error('请先在上方展开栏填入您的 Azure KEY 1 和 westus2。');
    }
  }

  async function finishAndScore() {
    if (!isRecording) return;
    isRecording = false;
    const btn = document.getElementById('tpRecBtn');
    btn.classList.remove('on');
    btn.textContent = '⏳ 正在出分...';

    stopMicMeter();

    if (pronWords.length === 0 && recognizer) {
      await Promise.race([
        new Promise(res => { gotResultPromiseResolve = res; }),
        new Promise(res => setTimeout(res, 1300))
      ]);
    }

    if (recognizer) {
      await new Promise(res => recognizer.stopContinuousRecognitionAsync(res, res));
      recognizer.close();
      recognizer = null;
    }

    btn.textContent = '🎤 重新朗读';
    evaluatePureAcoustic();
  }

  async function toggleEvaluation() {
    const txt = document.getElementById('tpTxt').value.trim();
    const btn = document.getElementById('tpRecBtn');

    if (isRecording) {
      await finishAndScore();
      return;
    }

    let speechConfig;
    try {
      speechConfig = await createAzureSpeechConfig();
    } catch (e) {
      setMsg(`⚠️ ${e.message}`);
      return;
    }

    renderSentence();
    pronWords = [];
    gotResultPromiseResolve = null;
    isRecording = true;

    btn.classList.add('on');
    btn.textContent = '⏹ 读完点击打分';
    setMsg('⏳ 正在启动麦克风...');

    await startMicMeter();

    speechConfig.speechRecognitionLanguage = "zh-CN";
    speechConfig.outputFormat = SpeechSDK.OutputFormat.Detailed;
    speechConfig.setProperty(SpeechSDK.PropertyId.SpeechServiceConnection_EndSilenceTimeoutMs, "1500");
    speechConfig.setProperty(SpeechSDK.PropertyId.Speech_SegmentationSilenceTimeoutMs, "1200");

    const audioConfig = SpeechSDK.AudioConfig.fromDefaultMicrophoneInput();

    // 关键升级：直接传入自定义 JSON 配置，强制开启 NBestPhonemeCount = 5
    // 这样 Azure 会返回你嘴里真实发出的 Top 5 实际音素与声调（如把 mai 3 读成 mai 4，第一候选就是 ai 4！）
    const pronConfig = SpeechSDK.PronunciationAssessmentConfig.fromJSON(JSON.stringify({
      referenceText: txt,
      gradingSystem: "HundredMark",
      granularity: "Phoneme",
      dimension: "Comprehensive",
      enableMiscue: true,
      phonemeAlphabet: "SAPI",
      nBestPhonemeCount: 5
    }));

    recognizer = new SpeechSDK.SpeechRecognizer(speechConfig, audioConfig);
    pronConfig.applyTo(recognizer);

    recognizer.sessionStarted = () => {
      if (isRecording) setMsg('🎙️ 麦克风已就绪！请开始朗读（读完停顿 1 秒自动出分）...');
    };

    recognizer.recognized = (s, e) => {
      if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech) {
        try {
          const json = JSON.parse(e.result.properties.getProperty(SpeechSDK.PropertyId.SpeechServiceResponse_JsonResult));
          const words = json?.NBest?.[0]?.Words || [];
          pronWords.push(...words);
        } catch (err) {}

        if (gotResultPromiseResolve) {
          gotResultPromiseResolve();
          gotResultPromiseResolve = null;
        }

        const validCount = pronWords.filter(w => /[\u4e00-\u9fa5]/.test(w.Word) && w.PronunciationAssessment?.ErrorType !== 'Insertion').length;
        if (isRecording && validCount >= Math.max(1, targets.length - 1)) {
          finishAndScore();
        }
      }
    };

    recognizer.canceled = (s, e) => {
      if (!isRecording) return;
      isRecording = false;
      stopMicMeter();
      btn.classList.remove('on');
      btn.textContent = '🎤 开始朗读';
      setMsg(`❌ Azure 报错：${e.errorDetails || '请检查 Key 和 westus2 是否正确'}`);
      if (recognizer) { recognizer.close(); recognizer = null; }
    };

    recognizer.startContinuousRecognitionAsync();
  }

  // 核心算法：从 Azure 底层 NBestPhonemes 中提取用户真实发出的声母、韵母和真实声调！
  function analyzeWordAcoustics(pw, targetObj) {
    if (!pw) return { isOmitted: true };

    const errType = pw.PronunciationAssessment?.ErrorType || 'None';
    const wordAcc = pw.PronunciationAssessment?.AccuracyScore ?? 0;
    if (errType === 'Omission' || wordAcc < 25) {
      return { isOmitted: true };
    }

    const phonemes = pw.Phonemes || [];
    let phonemeBaseMismatch = false;
    let detectedSpokenTone = null;
    let vowelAccuracy = wordAcc;

    for (const p of phonemes) {
      const expectedRaw = (p.Phoneme || '').trim(); // 例如 "w" 或 "o 3" 或 "ai 3"
      const pAcc = p.PronunciationAssessment?.AccuracyScore ?? wordAcc;
      const nbest = p.PronunciationAssessment?.NBestPhonemes || [];
      const topActualRaw = nbest[0]?.Phoneme ? nbest[0].Phoneme.trim() : expectedRaw;

      // 判断这个音素是不是带声调数字的韵母（如 "ai 3"）
      const expToneMatch = expectedRaw.match(/([1-5])\s*$/);

      if (expToneMatch) {
        vowelAccuracy = pAcc;
        // 提取用户真实发出的第一候选音素的声调（例如用户读了 "ai 4"，这里直接抓出 4！）
        const actToneMatch = topActualRaw.match(/([1-5])\s*$/);
        if (actToneMatch) {
          detectedSpokenTone = parseInt(actToneMatch[1], 10) % 5;
        }
        // 如果第一候选跟标准声调一样，但韵母得分较低 (< 82)，看第二候选是不是另一个声调（抓出隐藏的故意错调）
        if ((detectedSpokenTone === targetObj.tone || detectedSpokenTone === targetObj.origTone) && pAcc < 82 && nbest.length > 1) {
          const secondRaw = nbest[1].Phoneme.trim();
          const secMatch = secondRaw.match(/([1-5])\s*$/);
          if (secMatch && normPhoneme(secondRaw) === normPhoneme(expectedRaw)) {
            const secTone = parseInt(secMatch[1], 10) % 5;
            if (secTone !== targetObj.tone) {
              detectedSpokenTone = secTone;
            }
          }
        }

        // 检查韵母本身有没有读成完全别的韵母（比如把“我 o”读成“他 a”）
        if (pAcc < 55 && normPhoneme(topActualRaw) !== normPhoneme(expectedRaw)) {
          phonemeBaseMismatch = true;
        }
      } else {
        // 声母检查（比如把“我 w”读成“他 t”）
        if (pAcc < 50 && normPhoneme(topActualRaw) !== normPhoneme(expectedRaw)) {
          phonemeBaseMismatch = true;
        }
      }
    }

    return {
      isOmitted: false,
      wordAcc,
      vowelAccuracy,
      phonemeBaseMismatch,
      detectedSpokenTone
    };
  }

  function evaluatePureAcoustic() {
    const alignedPron = pronWords.filter(w =>
      /[\u4e00-\u9fa5]/.test(w.Word) &&
      w.PronunciationAssessment?.ErrorType !== 'Insertion'
    );

    if (!alignedPron.length) {
      return setMsg('⚠️ 未检测到语音：请观察朗读时绿色音量条是否跳动，读完停顿 1 秒后再试');
    }

    let passCount = 0;
    let debugDetails = [];

    targets.forEach((t, i) => {
      const pw = alignedPron[i];
      const res = analyzeWordAcoustics(pw, t);

      // 1. 漏读，或者声母/韵母完全读成了别的字（如把“我 wo”读成“他 ta”） -> 红灯（无声调箭头）
      if (res.isOmitted || res.phonemeBaseMismatch) {
        paintTrafficLight(i, 'bad', null, null);
        debugDetails.push(`${t.char}:读错字/漏读`);
        return;
      }

      // 2. 规则：一声 (1) 和 轻声 (0) 免检声调！只要声韵母没读成别的字，一律直接给绿灯！
      if (t.skipToneCheck) {
        paintTrafficLight(i, 'good', null, null);
        passCount += 1;
        debugDetails.push(`${t.char}:免检通过`);
        return;
      }

      // 3. 二声、三声、四声：严格检查真实声调！
      const spokenTone = res.detectedSpokenTone !== null ? res.detectedSpokenTone : t.tone;
      const isToneMatch = (spokenTone === t.tone || spokenTone === t.origTone);

      // 情况 3A：明确读成了另一个声调（例如把“买3”读成了“卖4”）
      if (!isToneMatch) {
        // 如果韵母/整字得分低 (< 72) 或者完全读成了对立声调 -> 红灯 + 顶部显示 4→3！
        if (res.wordAcc < 72 || res.vowelAccuracy < 72 || (spokenTone === 4 && t.tone === 3) || (spokenTone === 3 && t.tone === 4)) {
          paintTrafficLight(i, 'bad', spokenTone, t.tone);
          passCount += 0.2;
          debugDetails.push(`${t.char}:错调(${spokenTone}→${t.tone})`);
        } else {
          // 轻微声调混淆 -> 黄灯 + 顶部显示 错→正
          paintTrafficLight(i, 'warn', spokenTone, t.tone);
          passCount += 0.6;
          debugDetails.push(`${t.char}:微偏(${spokenTone}→${t.tone})`);
        }
        return;
      }

      // 情况 3B：虽然第一候选声调数字相同，但声学得分偏低 (50 ~ 78 分)，说明声调拐弯不到位 -> 黄灯提醒
      if (res.wordAcc < 78 || res.vowelAccuracy < 75) {
        paintTrafficLight(i, 'warn', '偏', t.tone);
        passCount += 0.7;
        debugDetails.push(`${t.char}:声调不到位(${Math.round(res.wordAcc)}分)`);
        return;
      }

      // 4. 读音与声调全部过关 -> 绿灯！
      paintTrafficLight(i, 'good', null, null);
      passCount += 1;
      debugDetails.push(`${t.char}:通过`);
    });

    const finalScore = Math.round((passCount / targets.length) * 100) || 0;
    setMsg(`评测完成！综合得分：<b>${finalScore} 分</b>`);

    const dbg = document.getElementById('tpDbg');
    dbg.style.display = 'block';
    dbg.innerHTML = `🔍 诊断详情：${debugDetails.join(' ｜ ')}`;
  }

  // 渲染红黄绿交通灯：无论黄灯还是红灯，只要有 wrongTone 和 correctTone，一律在头顶显示「错→正」（如 4→3）！
  function paintTrafficLight(i, status, wrongTone, correctTone) {
    const box = document.getElementById(`tp-c-${i}`);
    const tag = document.getElementById(`tp-t-${i}`);
    box.className = `tp-item ${status}`;
    if (wrongTone !== null && correctTone !== null) {
      tag.textContent = `${wrongTone}→${correctTone}`;
    } else {
      tag.textContent = '';
    }
  }

  function setMsg(t) { document.getElementById('tpMsg').innerHTML = t; }
</script>
</body>
</html>

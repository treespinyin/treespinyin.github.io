<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trees Pinyin</title>
  <meta name="theme-color" content="#1b5e20">
  <link rel="icon" type="image/png" href="/icon.png?v=3">

  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #111827;
      --accent: #1b5e20;
      --border: #dfe1e5;
      --danger: #d93025;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 28px 16px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* 1. 膠囊上方：僅顯示檔案建設時間 (無任何多餘按鈕) */
    .build-time-text {
      font-size: 0.78rem;
      font-weight: 700;
      color: #1b5e20;
      background: #e8f5e9;
      border: 1px solid #a5d6a7;
      padding: 4px 12px;
      border-radius: 999px;
      letter-spacing: 0.2px;
    }

    /* 2. 純淨谷歌膠囊搜索框 (僅輸入框 + 麥克風，Enter 或說完即答) */
    .google-capsule-wrap {
      width: 100%;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 32px;
      padding: 8px 10px 8px 22px;
      box-shadow: 0 2px 10px rgba(32, 33, 36, 0.08);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .google-capsule-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 4px 16px rgba(27, 94, 32, 0.16);
    }
    .capsule-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1.05rem;
      line-height: 1.45;
      color: var(--text);
      background: transparent;
      font-family: inherit;
      resize: none;
      max-height: 110px;
      padding: 4px 0;
    }
    .capsule-input::placeholder { color: #9aa0a6; }

    .mic-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: #f1f5f9;
      color: #1a73e8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    .mic-btn:hover { background: #e2e8f0; }
    .mic-btn:active { transform: scale(0.95); }
    .mic-btn svg { width: 22px; height: 22px; fill: currentColor; }
    .mic-btn.recording {
      background: var(--danger);
      color: #ffffff;
      animation: micPulse 1s infinite;
    }
    @keyframes micPulse {
      0% { box-shadow: 0 0 0 0 rgba(217, 48, 37, 0.45); }
      70% { box-shadow: 0 0 0 10px rgba(217, 48, 37, 0); }
      100% { box-shadow: 0 0 0 0 rgba(217, 48, 37, 0); }
    }

    /* 3. AI 回答與四位一體注音顯示卡片 */
    .answer-card {
      width: 100%;
      background: var(--card);
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.03);
      padding: 18px 20px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      --user-font-size: 20px;
    }

    .status-banner {
      width: 100%;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.92rem;
      font-weight: 600;
      color: #166534;
      display: none;
    }

    .annotation-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .sentence-block {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding-bottom: 14px;
      border-bottom: 1px dashed #e5e7eb;
    }
    .sentence-block:last-child { border-bottom: none; padding-bottom: 0; }

    .en-line {
      font-size: calc(var(--user-font-size) * 0.92);
      font-weight: 600;
      color: #1f2937;
      line-height: 1.42;
      max-width: 96%;
    }
    .char-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 0;
      align-items: flex-end;
    }
    .tp-col {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      margin: 0 0.28ch;
      cursor: pointer;
      padding: 2px 3px;
      border-radius: 6px;
      transition: background 0.12s;
    }
    .tp-col:hover { background: #f1f8e9; }
    .tp-py {
      font-size: calc(var(--user-font-size) * 0.96);
      font-weight: 700;
      font-style: italic;
      color: #1b5e20;
      line-height: 1.16;
      white-space: nowrap;
    }
    .tp-std {
      font-size: calc(var(--user-font-size) * 0.78);
      font-weight: 500;
      color: #6b7280;
      line-height: 1.15;
      white-space: nowrap;
    }
    .tp-zh {
      font-size: calc(var(--user-font-size) * 1.25);
      font-weight: 600;
      color: #000000;
      line-height: 1.22;
      min-height: 1.22em;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- 🕒 1. 膠囊上方：僅顯示檔案建設時間 -->
    <div class="build-time-text">
      🕒 Build: 2026-11-13 17:22 PST (v3.0 純淨谷歌膠囊 + 連貫對話記憶版)
    </div>

    <!-- 🔍 2. 純淨谷歌膠囊 (無任何多餘按鈕：打字按 Enter 提問，或點麥克風直接說中英文) -->
    <div class="google-capsule-wrap">
      <textarea id="userInput" class="capsule-input" rows="1"
        placeholder="Ask AI in Chinese or English (Press Enter or tap Mic)..."
        oninput="autoResizeTextarea(this)"></textarea>

      <button class="mic-btn" id="micBtn" onclick="toggleVoice()" title="Voice Input (Chinese & English)">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
      </button>
    </div>

    <!-- 📖 3. AI 回答與四位一體注音卡片 -->
    <div class="answer-card" id="answerCard">
      <div id="statusBanner" class="status-banner"></div>
      <div id="annotationList" class="annotation-list"></div>
    </div>

  </div>

  <script>
    // =========================================================================
    // 1. 全域端點與基礎轉換配置
    // =========================================================================
    const IS_LOCAL_FILE = window.location.protocol === 'file:';
    const CF_WORKER_ENDPOINTS = IS_LOCAL_FILE
      ? ['https://treespinyin-api.treespinyin.workers.dev', 'https://treespinyin.com/api']
      : ['https://treespinyin-api.treespinyin.workers.dev', '/api', 'https://treespinyin.com/api'];

    let openccToTrad = null;
    try {
      if (window.OpenCC) openccToTrad = window.OpenCC.Converter({ from: 'cn', to: 'tw' });
    } catch (e) {}

    function toTrad(str) {
      if (!str) return '';
      return openccToTrad ? openccToTrad(str) : str;
    }

    function autoResizeTextarea(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 110) + 'px';
    }

    // 按下 Enter 鍵直接提問
    document.getElementById('userInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        runSmartAI();
      }
    });

    // =========================================================================
    // 2. 🧠 輕量滑動視窗對話記憶 (保留最近 3 輪上下文，手機端 0 負擔 + 智慧追問識別)
    // =========================================================================
    const MAX_MEMORY_TURNS = 3;
    let conversationHistory = []; // 格式: [{ q: '...', a: '...' }]
    let lastInteractionTime = 0;

    // 判斷是否為依賴上文的「追問」(例如：「那第二句呢？」、「為什麼？」、「再舉個例子」、「What about...」)
    function isFollowUpQuestion(q) {
      if (conversationHistory.length === 0) return false;
      // 若距離上一輪超過 10 分鐘，自動視為新話題
      if (Date.now() - lastInteractionTime > 600000) {
        conversationHistory = [];
        return false;
      }
      const followUpPattern = /^(那|那麼|這|這個|它|他|她|為什麼|为什么|怎麼|怎么|還有|还有|再|第[一二三四五六七八九十\d]|什麼意思|什么意思|下一句|上一句|繼續|继续|解釋|解释|舉例|举例|what about|how about|why|and |also |explain|next|more|mean|it |this |that )/i;
      return followUpPattern.test(q.trim()) || q.trim().length <= 5;
    }

    function pushConversationMemory(userQ, aiRawReply) {
      if (!userQ || !aiRawReply) return;
      const compactReply = aiRawReply.split(/\r?\n+/).slice(0, 4).join(' / ').slice(0, 260);
      conversationHistory.push({ q: userQ, a: compactReply });
      if (conversationHistory.length > MAX_MEMORY_TURNS) {
        conversationHistory.shift();
      }
      lastInteractionTime = Date.now();
    }

    function buildMemoryContextString() {
      if (conversationHistory.length === 0) return '';
      const lines = conversationHistory.map((item, idx) => `Turn ${idx + 1} - User: "${item.q}" | AI: "${item.a}"`);
      return '\nRecent Conversation Context (use this ONLY if the user\'s current request is a follow-up):\n' + lines.join('\n');
    }

    // =========================================================================
    // 3. 🎙️ 高包容度谷歌膠囊語音輸入引擎 (無多餘按鈕，自動收集 5 候選詞交給 AI 甄別)
    // =========================================================================
    let activeRec = null;
    let voiceSilenceTimer = null;
    let latestVoiceCandidates = [];

    const FUZZY_VOICE_CORRECTIONS = [
      [/永和|泳鵝|泳鹅|勇鵝|勇鹅|擁鵝|拥鹅|用鵝|用鹅|詠俄|咏俄|影鵝|影鹅/g, '詠鵝'],
      [/今夜思|敬業思|敬业思|進夜思|进夜思|淨夜思|净夜思|經夜思|经夜思/g, '靜夜思'],
      [/春小|春笑|春校|純曉|纯晓|蠢小/g, '春曉'],
      [/登貫雀樓|登贯雀楼|登觀雀樓|登观雀楼|登冠雀樓|登冠雀楼/g, '登鸛雀樓'],
      [/水調歌頭|水调歌头|水掉歌頭|水掉歌头|水釣歌頭/g, '水調歌頭'],
      [/鹿柴|路窄|陸宅|陆宅|錄音帶|露寨/g, '鹿柴'],
      [/敏農|敏农|米農|米农|民農|民农/g, '憫農'],
      [/遊子音|游子音|油籽吟|由子吟/g, '遊子吟'],
      [/清明時節|親明時節|清明世界/g, '清明'],
      [/望廬山瀑布|望盧山瀑布|忘廬山瀑布/g, '望廬山瀑布']
    ];

    function applyFuzzyVoiceCorrection(rawTranscript, alts = []) {
      for (const a of alts) {
        if (/詠鵝|咏鹅|靜夜思|静夜思|春曉|春晓|登鸛雀樓|登鹳雀楼|水調歌頭|水调歌头|鹿柴|憫農|悯农|遊子吟|游子吟|望廬山瀑布/.test(a)) {
          return a.trim();
        }
      }
      let fixed = rawTranscript || '';
      for (const [pattern, replacement] of FUZZY_VOICE_CORRECTIONS) {
        fixed = fixed.replace(pattern, replacement);
      }
      return fixed.trim();
    }

    function toggleVoice() {
      const btn = document.getElementById('micBtn');
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        alert('請使用 Chrome、Edge 或 Safari 瀏覽器以支援語音輸入。');
        return;
      }

      if (activeRec) {
        clearTimeout(voiceSilenceTimer);
        activeRec.stop();
        return;
      }

      latestVoiceCandidates = [];
      const inputEl = document.getElementById('userInput');
      inputEl.value = '';
      autoResizeTextarea(inputEl);

      activeRec = new SR();
      // zh-CN 聲學模型原生內建中英文雙語詞庫，配合 AI 的 5 候選詞音譯還原，無需手動切換按鈕
      activeRec.lang = 'zh-CN';
      activeRec.interimResults = true;
      activeRec.maxAlternatives = 5;
      activeRec.continuous = true;
      btn.classList.add('recording');

      const banner = document.getElementById('statusBanner');
      banner.style.display = 'block';
      banner.innerText = '🔴 正在聆聽（請直接說中文或英文，說完停頓即自動回答）...';

      const segmentPrimary = [];
      const segmentAlts = [];

      function resetSilenceTimer() {
        clearTimeout(voiceSilenceTimer);
        voiceSilenceTimer = setTimeout(() => {
          if (activeRec) activeRec.stop();
        }, 3000);
      }

      resetSilenceTimer();

      activeRec.onresult = (e) => {
        resetSilenceTimer();
        let interimText = '';

        for (let i = e.resultIndex; i < e.results.length; i++) {
          const res = e.results[i];
          const altsForThisSeg = [];
          for (let k = 0; k < res.length; k++) {
            const t = (res[k]?.transcript || '').trim();
            if (t) altsForThisSeg.push(t);
          }

          if (res.isFinal) {
            const bestSeg = applyFuzzyVoiceCorrection(res[0].transcript.trim(), altsForThisSeg);
            segmentPrimary[i] = bestSeg;
            segmentAlts[i] = altsForThisSeg;
          } else {
            interimText += res[0].transcript;
          }
        }

        const completedText = segmentPrimary.filter(Boolean).join(' ');
        const fullCurrentText = applyFuzzyVoiceCorrection((completedText + (interimText ? ' ' + interimText : '')).trim());

        const combinedCandidates = new Set();
        if (fullCurrentText) combinedCandidates.add(fullCurrentText);
        for (let k = 0; k < 5; k++) {
          const altSentence = segmentAlts
            .map((arr, idx) => (arr && arr[k]) ? arr[k] : (segmentPrimary[idx] || ''))
            .filter(Boolean)
            .join(' ')
            .trim();
          if (altSentence) combinedCandidates.add(altSentence);
        }

        latestVoiceCandidates = Array.from(combinedCandidates).slice(0, 5);
        inputEl.value = fullCurrentText;
        autoResizeTextarea(inputEl);
      };

      activeRec.onend = () => {
        clearTimeout(voiceSilenceTimer);
        btn.classList.remove('recording');
        activeRec = null;
        const spoken = inputEl.value.trim();
        if (spoken) {
          runSmartAI(spoken, latestVoiceCandidates);
        } else {
          banner.style.display = 'none';
        }
      };

      activeRec.onerror = () => {
        clearTimeout(voiceSilenceTimer);
        btn.classList.remove('recording');
        activeRec = null;
        banner.style.display = 'none';
      };

      try {
        activeRec.start();
      } catch (err) {}
    }

    // =========================================================================
    // 4. 數字與符號轉中文口語 + Trees Pinyin 63 規則自然拼讀編譯器
    // =========================================================================
    const DIGITS_ZH = ['零','一','二','三','四','五','六','七','八','九'];

    function intToChinese(numStr) {
      let n = parseInt(numStr, 10);
      if (isNaN(n)) return numStr;
      if (n === 0) return '零';
      if (n < 0) return '負' + intToChinese(String(-n));
      if (numStr.length === 4 && n >= 1900 && n <= 2099) {
        return numStr.split('').map(d => DIGITS_ZH[parseInt(d, 10)]).join('');
      }
      if (n < 10) return DIGITS_ZH[n];
      if (n < 100) {
        let ten = Math.floor(n / 10), rem = n % 10;
        return (ten === 1 ? '十' : DIGITS_ZH[ten] + '十') + (rem > 0 ? DIGITS_ZH[rem] : '');
      }
      if (n < 1000) {
        let hun = Math.floor(n / 100), rem = n % 100;
        if (rem === 0) return DIGITS_ZH[hun] + '百';
        if (rem < 10) return DIGITS_ZH[hun] + '百零' + DIGITS_ZH[rem];
        return DIGITS_ZH[hun] + '百' + intToChinese(String(rem));
      }
      if (n < 10000) {
        let th = Math.floor(n / 1000), rem = n % 1000;
        if (rem === 0) return DIGITS_ZH[th] + '千';
        if (rem < 100) return DIGITS_ZH[th] + '千零' + intToChinese(String(rem));
        return DIGITS_ZH[th] + '千' + intToChinese(String(rem));
      }
      return numStr.split('').map(d => DIGITS_ZH[parseInt(d, 10)] || d).join('');
    }

    function numberToChinese(str) {
      if (str.includes('.')) {
        let parts = str.split('.');
        let intPart = intToChinese(parts[0] || '0');
        let decPart = parts[1].split('').map(d => DIGITS_ZH[parseInt(d, 10)]).join('');
        return intPart + '點' + decPart;
      }
      return intToChinese(str);
    }

    function expandNumbersAndSymbolsToZh(text) {
      if (!text) return '';
      let s = text;
      s = s.replace(/\bH2O\b/gi, '水').replace(/\bCO2\b/gi, '二氧化碳').replace(/\bO2\b/gi, '氧氣');
      s = s.replace(/\bWi-?Fi\b/gi, '無線網路').replace(/\bAPP\b/gi, '應用程式').replace(/\bAI\b/gi, '人工智慧');
      s = s.replace(/°C|℃/g, '攝氏度').replace(/°F|℉/g, '華氏度');
      s = s.replace(/\b(\d{1,2}):(\d{2})\b/g, (_, h, m) => intToChinese(h) + '點' + (m === '00' ? '整' : intToChinese(m) + '分'));
      s = s.replace(/(\d+(?:\.\d+)?)\s*%/g, (_, num) => '百分之' + numberToChinese(num));
      s = s.replace(/\$\s*(\d+(?:\.\d+)?)/g, (_, num) => numberToChinese(num) + '美元');
      s = s.replace(/[¥￥]\s*(\d+(?:\.\d+)?)/g, (_, num) => numberToChinese(num) + '元');
      s = s.replace(/\+/g, '加').replace(/=/g, '等於').replace(/&/g, '和');
      s = s.replace(/\d+(?:\.\d+)?/g, (match) => numberToChinese(match));
      return s;
    }

    const OVERALL_16 = {
      'zhi': '(r)ds', 'chi': '(r)ts', 'shi': '(r)s', 'ri': '(r)th', 'zi': 'ds', 'ci': 'ts', 'si': 's', 'yi': 'yee',
      'wu': 'woo', 'yu': 'yee(oo)', 'ye': 'yer', 'yue': 'yee(oo)er', 'yuan': 'yee(oo)an', 'yin': 'yeen', 'yun': 'yee(oo)n', 'ying': 'ying'
    };
    const LOCKED_MAP = {
      'wo': 'wer', 'de': 'der', 'le': 'Ler', 'ren': '(r)ther-n', 'wen': 'wer-n', 'shun': 'soon', 'zun': 'dsoon',
      'guo': 'gooer', 'o': 'oh', 'qi': 'tsee', 'qing': 'tsing', 'qie': 'tseer', 'qian': 'tseean', 'qiao': 'tseeaw',
      'qiang': 'tseeang', 'qiong': 'tseer-oong', 'qu': 'tsee(oo)', 'que': 'tsee(oo)er', 'quan': 'tsee(oo)an',
      'qun': 'tsee(oo)n', 'qin': 'tseen', 'qia': 'tseeah', 'xi': 'see', 'xing': 'sing', 'xie': 'seer', 'xian': 'seean',
      'xiao': 'seeaw', 'xiang': 'seeang', 'xiong': 'seer-oong', 'xu': 'see(oo)', 'xue': 'see(oo)er', 'xuan': 'see(oo)an',
      'xun': 'see(oo)n', 'xin': 'seen', 'xia': 'seeah', 'ji': 'jee', 'jing': 'jing', 'jie': 'jeer', 'jian': 'jeean',
      'jiao': 'jeeaw', 'jiang': 'jeeang', 'jiong': 'jeer-oong', 'ju': 'jee(oo)', 'jue': 'jee(oo)er', 'juan': 'jee(oo)an',
      'jun': 'jee(oo)n', 'jin': 'jeen', 'jia': 'jeeah', 'lv': 'Lee(oo)', 'lü': 'Lee(oo)', 'lve': 'Lee(oo)er', 'lüe': 'Lee(oo)er',
      'nv': 'nee(oo)', 'nü': 'nee(oo)', 'nve': 'nee(oo)er', 'nüe': 'nee(oo)er'
    };
    const INITIALS = {
      'b':'b', 'p':'p', 'm':'m', 'f':'f', 'd':'d', 't':'t', 'n':'n', 'l':'L', 'g':'g', 'k':'k', 'h':'h', 'j':'j',
      'q':'tsee', 'x':'see', 'zh':'(r)ds', 'ch':'(r)ts', 'sh':'(r)s', 'r':'(r)th', 'z':'ds', 'c':'ts', 's':'s', 'y':'y', 'w':'w'
    };
    const FINALS = {
      'a':'ah', 'o':'ooer', 'e':'er', 'i':'ee', 'u':'oo', 'v':'ee(oo)', 'ü':'ee(oo)', 'ai':'ie', 'ei':'ay', 'ui':'ooay',
      'ao':'aw', 'ou':'oh', 'iu':'eeoh', 'ie':'eer', 've':'ee(oo)er', 'üe':'ee(oo)er', 'er':'(uh)-er', 'an':'an', 'en':'er-n',
      'in':'een', 'un':'oon', 'vn':'ee(oo)n', 'ün':'ee(oo)n', 'ang':'ang', 'eng':'er-ng', 'ing':'ing', 'ong':'er-oong',
      'ia':'eeah', 'ian':'eean', 'iao':'eeaw', 'iang':'eeang', 'iong':'eer-oong', 'ua':'ooah', 'uai':'ooie', 'uan':'ooan',
      'uang':'ooang', 'uo':'ooer', 'van':'ee(oo)an', 'üan':'ee(oo)an'
    };

    function compileToTreesPinyin(pyNum) {
      if (!pyNum) return '';
      let m = pyNum.trim().match(/^([a-züv:]+)([0-5]?)$/i);
      if (!m) return pyNum;
      let syl = m[1].toLowerCase().replace('ü', 'v').replace('u:', 'v');
      let tone = m[2] || '';
      let mapped = '';
      if (syl === 'er') mapped = (tone === '4') ? 'uh-er' : '(uh)-er';
      else if (OVERALL_16[syl]) mapped = OVERALL_16[syl];
      else if (LOCKED_MAP[syl]) mapped = LOCKED_MAP[syl];
      else {
        let init = '', fin = syl;
        for (let l of ['zh', 'ch', 'sh']) { if (syl.startsWith(l)) { init = l; fin = syl.slice(2); break; } }
        if (!init && syl.length > 1 && 'bpmfdtnlgkhjqxzcsryw'.includes(syl[0])) { init = syl[0]; fin = syl.slice(1); }
        let mappedInit = INITIALS[init] || init;
        let mappedFin = FINALS[fin] || fin;
        if (mappedInit.endsWith('ee') && mappedFin.startsWith('ee')) mapped = mappedInit + mappedFin.slice(2);
        else if (mappedInit.endsWith('ee') && mappedFin.startsWith('i')) mapped = mappedInit.slice(0, -2) + mappedFin;
        else if (init === 'y' && mappedFin.startsWith('ee')) mapped = 'y' + mappedFin;
        else if (init === 'w' && mappedFin.startsWith('oo')) mapped = 'w' + mappedFin;
        else mapped = mappedInit + mappedFin;
      }
      let toneSuffix = (tone === '2' || tone === '3' || tone === '4') ? tone : '';
      return mapped + toneSuffix;
    }

    function numPinyinToToneMark(pyNum) {
      if (!pyNum) return '';
      const m = pyNum.trim().match(/^([a-züv:]+)([1-5]?)$/i);
      if (!m) return pyNum;
      let s = m[1].toLowerCase().replace('v', 'ü').replace('u:', 'ü');
      const t = parseInt(m[2] || '5', 10);
      if (t < 1 || t > 4) return s;
      const marks = { a:['ā','á','ǎ','à'], e:['ē','é','ě','è'], i:['ī','í','ǐ','ì'], o:['ō','ó','ǒ','ò'], u:['ū','ú','ǔ','ù'], ü:['ǖ','ǘ','ǚ','ǜ'] };
      if (s.includes('a')) return s.replace('a', marks.a[t-1]);
      if (s.includes('e')) return s.replace('e', marks.e[t-1]);
      if (s.includes('ou')) return s.replace('o', marks.o[t-1]);
      for (let i = s.length - 1; i >= 0; i--) { if (marks[s[i]]) return s.slice(0, i) + marks[s[i]][t-1] + s.slice(i + 1); }
      return s;
    }

    function getAccuratePinyinArray(zhText) {
      let pyArr = pinyinPro.pinyin(zhText, { type: 'array', toneType: 'num' });
      for (let word in CUSTOM_POLYPHONES) {
        let idx = zhText.indexOf(word);
        while (idx !== -1) {

    function initFemaleVoice() {
      if (!('speechSynthesis' in window)) return;
      const all = window.speechSynthesis.getVoices();
      const zhAll = all.filter(v => /zh|cmn|chi/i.test(v.lang) || /chinese|mandarin|taiwan/i.test(v.name));
      const priority = ['meijia', 'hsiaochen', 'xiaoxiao', 'ting-ting', 'google 國語', 'google 普通話'];
      zhAll.sort((a, b) => {
        const aS = priority.findIndex(k => a.name.toLowerCase().includes(k));
        const bS = priority.findIndex(k => b.name.toLowerCase().includes(k));
        return (aS === -1 ? 99 : aS) - (bS === -1 ? 99 : bS);
      });
      if (zhAll.length > 0) selectedVoiceObj = zhAll[0];

      if (!text || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

    async function translateFastFallback(text, fromLang, toLang) {
      const isZhToEn = fromLang.startsWith('zh');
      const src = isZhToEn ? 'zh-CN' : 'en';
      const tgt = isZhToEn ? 'en' : 'zh-CN';
      const tasks = [
        fetchWithTimeout(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${src}&tl=${tgt}&dt=t&q=${encodeURIComponent(text)}`, {}, 4000)
          .then(r => r.json())
          .then(d => {
            const j = d?.[0]?.map(x => x[0]).join('');
            if (j && j.trim()) return j.trim();
            throw new Error('empty');
          }),
        fetchWithTimeout(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${src}|${tgt}`, {}, 4500)
          .then(r => r.json())
          .then(d => {
            const t = d?.responseData?.translatedText;
            if (t && !t.includes('MYMEMORY WARNING')) return t.trim();
            throw new Error('empty');
          })
      ];
      try {
        return await Promise.any(tasks);
      } catch (e) {
        return text;
      }
    }

    function appendSentenceProgressive(rawZhText, enTranslation = '') {
      const list = document.getElementById('annotationList');
      const block = document.createElement('div');
      block.className = 'sentence-block';

      const expandedZh = expandNumbersAndSymbolsToZh(rawZhText);
      const tradZh = toTrad(expandedZh);
      block.dataset.zh = tradZh;
      block.dataset.en = enTranslation;

      const enDiv = document.createElement('div');
      enDiv.className = 'en-line';
      const hasEn = Boolean(enTranslation && enTranslation.trim());
      enDiv.innerText = hasEn ? enTranslation.trim() : '...';
      block.appendChild(enDiv);

      const charRow = document.createElement('div');
      charRow.className = 'char-row';
      const pinyinList = getAccuratePinyinArray(tradZh);

      for (let i = 0; i < tradZh.length; i++) {
        const char = tradZh[i];
        const isChinese = /[\u4e00-\u9fa5]/.test(char);
        const col = document.createElement('div');
        col.className = 'tp-col';

        if (isChinese) {
          const pyNum = pinyinList[i] || '';
          const tp = compileToTreesPinyin(pyNum);
          const stdTone = numPinyinToToneMark(pyNum);
          col.innerHTML = `<span class="tp-py">${tp}</span><span class="tp-std">${stdTone}</span><span class="tp-zh">${char}</span>`;
          col.onclick = () => speakText(char);
        } else {
          col.innerHTML = `<span class="tp-py">${char}</span><span class="tp-std">&nbsp;</span><span class="tp-zh">&nbsp;</span>`;
        }
        charRow.appendChild(col);
      }

      block.appendChild(charRow);
      list.appendChild(block);

      if (!hasEn) {
        translateFastFallback(tradZh, 'zh', 'en').then(en => {
          enDiv.innerText = en;
          block.dataset.en = en;
        });
      }
    }

    async function discoverFastModels(key) {
      if (!key) return;
      try {
        const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
        if (!r.ok) return;
        const data = await r.json();
        const all = (data.models || [])
          .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
          .map(m => m.name.replace('models/', ''))
          .filter(n => !/tts|image|imagen|embedding|veo|robotics|aqa|bison|gecko/i.test(n));

        const priority = [
          'gemini-flash-latest',
          'gemini-2.5-flash',
          'gemini-3.5-flash',
          'gemini-flash-lite-latest',
          'gemini-2.0-flash'
        ];
        const sorted = [];
        for (const p of priority) {
          if (all.includes(p)) sorted.push(p);
        }
        for (const m of all) {
          if ((m.includes('flash') || m.includes('latest')) && !sorted.includes(m)) sorted.push(m);
        }
        if (sorted.length > 0) availableFastModels = sorted;
      } catch (e) {}
    }
    if (backupKey) discoverFastModels(backupKey);

    function fetchWithTimeout(url, options = {}, timeoutMs = 7500) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      return fetch(url, { ...options, signal: ctrl.signal }).finally(() => clearTimeout(timer));
    }

    async function callSingleGeminiModelFast(modelName, promptText, signal) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(backupKey)}`;
      let r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }],
          generationConfig: { temperature: 0.1, thinkingConfig: { thinkingBudget: 0 } }
        }),
        signal
      });

      if (r.status === 404) {
        discoverFastModels(backupKey);
        throw new Error('MODEL_RENAMED_404');
      }

      if (r.status === 400) {
        r = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: { temperature: 0.1 }
          }),
          signal
        });
      }

      const d = await r.json();
      if (!r.ok) throw new Error(d?.error?.message || `HTTP ${r.status}`);

      const resParts = d?.candidates?.[0]?.content?.parts || [];
      const text = resParts
        .filter(p => !p.thought && typeof p.text === 'string')
        .map(p => p.text)
        .join('')
        .trim();

      if (!text) throw new Error('EMPTY');
      return text;
    }

    function cleanChineseSentence(line) {
      if (!line) return '';
      let s = expandNumbersAndSymbolsToZh(line)
        .replace(/^[-*•\d.)、]+\s*/, '')
        .replace(/\*+/g, '')
        .replace(/\([^)]*[A-Za-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ][^)]*\)/g, '')
        .replace(/（[^）]*[A-Za-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ][^）]*）/g, '')
        .replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜA-Za-z]{2,}/g, '')
        .replace(/([，。！？；：、,.!?;:])\s*[，。！？；：、,.!?;:]+/g, '$1')
        .replace(/^[，。！？；：、,.!?;:\s]+/, '')
        .replace(/\s+/g, '')
        .trim();
      return /[\u4e00-\u9fa5]/.test(s) ? s : '';
    }

    function parseBilingualPairLine(rawLine) {
      const cleaned = rawLine.replace(/^[-*•\d.)、]+\s*/, '').replace(/\*+/g, '').trim();
      if (!cleaned.includes('|||')) return null;
      const parts = cleaned.split('|||').map(p => p.trim()).filter(Boolean);
      if (parts.length < 2) return null;

      let zhPart = '', enPart = '';
      if (/[\u4e00-\u9fa5]/.test(parts[0]) && !/[\u4e00-\u9fa5]/.test(parts[1])) {
        zhPart = cleanChineseSentence(parts[0]) || parts[0];
        enPart = parts[1];
      } else if (/[\u4e00-\u9fa5]/.test(parts[1])) {
        enPart = parts[0];
        zhPart = cleanChineseSentence(parts[1]) || parts[1];
      } else {
        zhPart = cleanChineseSentence(parts[0]) || parts[0];
        enPart = parts[1];
      }
      if (!/[\u4e00-\u9fa5]/.test(zhPart)) return null;
      return { zh: zhPart, en: enPart };
    }

    async function renderBilingualAIOutput(aiText) {
      const banner = document.getElementById('statusBanner');
      banner.style.display = 'none';
      const rawLines = aiText.split(/\r?\n+/).map(l => l.trim()).filter(Boolean);
      if (rawLines.length === 0) return false;

      const seenExactZh = new Set();
      let renderedPairs = 0;

      for (const rawLine of rawLines) {
        const pair = parseBilingualPairLine(rawLine);
        if (pair) {
          const key = pair.zh.replace(/[^\u4e00-\u9fa5]/g, '');
          if (!key || seenExactZh.has(key)) continue;
          seenExactZh.add(key);
          renderedPairs++;
          appendSentenceProgressive(pair.zh, pair.en);
          await nextPaintTick();
        } else {
          const lineStr = rawLine.replace(/^[-*•\d.)、]+\s*/, '').replace(/\*+/g, '').trim();
          const parenMatch = lineStr.match(/^(.+?)\s*[(（]([A-Za-z][^）)]+)[)）]$/);
          let zhStr = '', enStr = '';
          if (parenMatch && /[\u4e00-\u9fa5]/.test(parenMatch[1])) {
            zhStr = cleanChineseSentence(parenMatch[1]) || parenMatch[1].trim();
            enStr = parenMatch[2].trim();
          } else {
            zhStr = cleanChineseSentence(lineStr);
          }
          if (zhStr) {
            const key = zhStr.replace(/[^\u4e00-\u9fa5]/g, '');
            if (!key || seenExactZh.has(key)) continue;
            seenExactZh.add(key);
            renderedPairs++;
            appendSentenceProgressive(zhStr, enStr);
            await nextPaintTick();
          }
        }
      }
      return renderedPairs > 0;
    }

        '1. High Voice & Context Tolerance: If the user\'s input has a voice-recognition homophone typo (e.g., "永和" instead of "詠鵝", "路窄" instead of "鹿柴", or phonetic Chinese characters representing spoken English words), or is a follow-up referring to the Recent Conversation Context above, answer the intended question accurately and coherently.',
        '2. Formulate the complete, authoritative standard answer or authentic classic text:',
        '   - If the user asks about a Chinese poem/classic (e.g., 詠鵝, 靜夜思, 水調歌頭, 鹿柴): Output ONLY the Title+Author on Line 1, followed by the COMPLETE original verses. No extra commentary!',
        '   - If the user asks any other question or follow-up in English or Chinese: Output a clear, concise, accurate bilingual answer.',
        '3. Output Format (Every single line MUST use "|||"):',
        '   - Line 1: Chinese_Title_or_Summary ||| English_Title_or_Summary',
        '   - Line 2+: Pure_Chinese_Sentence ||| Authentic_English_Sentence',
        '   - IMPORTANT: Left side of "|||" must contain ONLY Traditional Chinese characters and Chinese punctuation (write all numbers/terms in Chinese characters, NO Pinyin, NO English letters on the left side). Never repeat any line.'
      ].filter(Boolean).join('\n');

      // 追問時不使用獨立問題快取 Key，獨立提問時使用共享快取 Key
      const cloudCacheKey = followUp ? '' : normalizeCacheKey(q);
      const aiText = await fetchFastAccurateAI(directPrompt, cloudCacheKey);

      if (aiText) {
        const ok = await renderBilingualAIOutput(aiText);
        if (ok) {
          if (!followUp) saveLocalCachedAnswer(q, aiText);
          pushConversationMemory(q, aiText);
          return;
        }
      }

      // 3. 免 Key 雙語保底：確保任何網路環境下都有回應
      banner.style.display = 'none';
      const hasZh = /[\u4e00-\u9fa5]/.test(q);
      if (hasZh) {
        const enTrans = await translateFastFallback(q, 'zh', 'en');
        appendSentenceProgressive(q, enTrans);
        pushConversationMemory(q, `${q} ||| ${enTrans}`);
      } else {
        const zhTrans = await translateFastFallback(q, 'en', 'zh');
        appendSentenceProgressive(zhTrans, q);
        pushConversationMemory(q, `${zhTrans} ||| ${q}`);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      appendSentenceProgressive('請問你想向人工智慧提問什麼問題？', 'What question would you like to ask AI today?');
    });
  </script>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 0.5s 極速競速測試台</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #22c55e;
      --blue: #3b82f6;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .status-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.9rem;
    }
    .badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.82rem;
    }
    .badge-ok { background: rgba(34,197,94,0.2); color: #4ade80; border: 1px solid #22c55e; }
    .badge-warn { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .badge-err { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid #ef4444; }

    .key-box {
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
      flex-wrap: wrap;
    }
    .key-input, .model-select {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0f172a;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .key-input { flex: 1; min-width: 200px; }
    .model-select { min-width: 210px; cursor: pointer; }

    .search-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .search-card:focus-within { border-color: var(--blue); }
    textarea {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      font-size: 1.08rem;
      line-height: 1.5;
      font-family: inherit;
      background: transparent;
      color: #fff;
      min-height: 58px;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 0.94rem;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s;
    }
    button:hover { filter: brightness(1.1); }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-outline { background: #334155; color: #e2e8f0; }

    .output-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      min-height: 170px;
    }
    .engine-tag {
      display: inline-block;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 8px;
      background: rgba(34,197,94,0.18);
      color: #4ade80;
      border: 1px solid #22c55e;
      margin-bottom: 14px;
    }
    .answer-text {
      font-size: 1.12rem;
      line-height: 1.75;
      white-space: pre-wrap;
      color: #f1f5f9;
    }
    .log-box {
      font-family: monospace;
      font-size: 0.82rem;
      background: #020617;
      color: #38bdf8;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #1e293b;
      max-height: 170px;
      overflow-y: auto;
      line-height: 1.5;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 style="margin:0;">⚡ 純 AI 極速競速測試台（強制關閉思考延遲 · 多模型賽跑）</h2>

    <div class="status-bar">
      <div class="status-row">
        <span>🔑 <b>Google Gemini 雲端狀態：</b></span>
        <span id="geminiKeyStatus" class="badge badge-warn">檢測中...</span>
      </div>

      <div class="key-box">
        <input type="password" id="apiKeyInput" class="key-input" placeholder="貼入您的 Google Gemini API Key (AIzaSy...)">
        <select id="modelSelect" class="model-select">
          <option value="AUTO_RACE">🔥 自動多模型極速賽跑 (最快)</option>
        </select>
        <button class="btn-green" onclick="saveAndVerifyKey()">儲存並測試</button>
      </div>
    </div>

    <div class="search-card">
      <textarea id="promptInput">請背誦唐詩《詠鵝》，並給出簡短解釋。</textarea>
      <div class="btn-row">
        <button class="btn-outline" onclick="askViaBrowserTab()">🚀 免 Key：一鍵跳轉瀏覽器 Gemini 提問</button>
        <button class="btn-primary" onclick="runFastAI()">✨ 立即極速回答 (0思考延遲)</button>
      </div>
    </div>

    <div class="output-card">
      <div id="activeEngineTag" class="engine-tag" style="display:none;"></div>
      <div id="answerOutput" class="answer-text">點擊上方「✨ 立即極速回答」開始測試...</div>
    </div>

    <div class="log-box" id="debugLog">▶ 系統就緒...</div>
  </div>

  <script>
    let savedApiKey = (localStorage.getItem('tp_test_gemini_key') || '').trim();
    let availableFlashModels = [];
    let waitingRelay = false;

    function logMsg(msg) {
      const box = document.getElementById('debugLog');
      const time = new Date().toLocaleTimeString();
      box.textContent += `\n[${time}] ${msg}`;
      box.scrollTop = box.scrollHeight;
    }

    window.addEventListener('DOMContentLoaded', async () => {
      if (savedApiKey) {
        document.getElementById('apiKeyInput').value = savedApiKey;
        await loadAvailableModels(savedApiKey);
      } else {
        document.getElementById('geminiKeyStatus').innerText = '未填入 API Key';
      }
    });

    // 1. 獲取所有支援 generateContent 的模型，並把最快的不帶深度思考延遲的模型排在最前面
    async function loadAvailableModels(key) {
      const statusEl = document.getElementById('geminiKeyStatus');
      statusEl.className = 'badge badge-warn';
      statusEl.innerText = '正在探測最快模型...';

      try {
        const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
        const data = await r.json();
        if (!r.ok) {
          throw new Error(data?.error?.message || `HTTP ${r.status}`);
        }

        const allModels = (data.models || [])
          .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
          .map(m => m.name.replace('models/', ''))
          // 排除純圖片/TTS/嵌入模型
          .filter(name => !name.includes('tts') && !name.includes('image') && !name.includes('embedding') && !name.includes('veo') && !name.includes('robotics'));

        // 速度優先排序：lite 與 flash 優先（避免 pro 模型長考 10 秒）
        const fastOrder = [
          'gemini-2.0-flash',
          'gemini-2.0-flash-lite',
          'gemini-2.5-flash-lite',
          'gemini-3.5-flash-lite',
          'gemini-flash-lite-latest',
          'gemini-flash-latest',
          'gemini-2.5-flash',
          'gemini-3.5-flash',
          'gemini-3.8-flash'
        ];

        availableFlashModels = [];
        for (const f of fastOrder) {
          if (allModels.includes(f)) availableFlashModels.push(f);
        }
        for (const m of allModels) {
          if (m.includes('flash') && !availableFlashModels.includes(m)) {
            availableFlashModels.push(m);
          }
        }
        if (availableFlashModels.length === 0) {
          availableFlashModels = allModels.slice(0, 4);
        }

        // 填充下拉選單
        const sel = document.getElementById('modelSelect');
        sel.innerHTML = `<option value="AUTO_RACE">🔥 自動多模型極速賽跑 (前3名並發)</option>`;
        availableFlashModels.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m;
          opt.textContent = `⚡ 單獨鎖定: ${m}`;
          sel.appendChild(opt);
        });

        statusEl.className = 'badge badge-ok';
        statusEl.innerText = `已就緒 (共 ${availableFlashModels.length} 個高速模型可用)`;
        logMsg(`✅ 可用高速模型排序: ${availableFlashModels.slice(0, 5).join(' -> ')}`);
        return true;
      } catch (e) {
        statusEl.className = 'badge badge-err';
        statusEl.innerText = `驗證失敗: ${e.message}`;
        logMsg(`❌ 探測模型失敗: ${e.message}`);
        return false;
      }
    }

    async function saveAndVerifyKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      if (!val) return;
      savedApiKey = val;
      localStorage.setItem('tp_test_gemini_key', val);
      const ok = await loadAvailableModels(val);
      if (ok) runFastAI();
    }

    // 2. 針對單一模型發起無思考延遲請求（自動兼容帶/不帶 thinkingConfig）
    async function callSingleModelFast(modelName, promptText, signal) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(savedApiKey)}`;

      // 嘗試關閉 thinkingBudget 以實現 0 思考等待直出；若該模型不支援 thinkingConfig 參數則自動用基礎格式
      const bodyWithNoThinking = {
        contents: [{ parts: [{ text: `請直接、準確、精煉地用中文回答，不要多餘客套話：\n${promptText}` }] }],
        generationConfig: {
          temperature: 0.2,
          thinkingConfig: { thinkingBudget: 0 }
        }
      };

      let r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bodyWithNoThinking),
        signal
      });

      // 如果模型報 400 (不認識 thinkingConfig)，立即回退不帶 thinkingConfig 的純淨請求
      if (r.status === 400) {
        r = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `請直接、準確、精煉地用中文回答，不要多餘客套話：\n${promptText}` }] }],
            generationConfig: { temperature: 0.2 }
          }),
          signal
        });
      }

      const d = await r.json();
      if (!r.ok) {
        throw new Error(`${modelName}: ${d?.error?.message || r.status}`);
      }

      // 過濾掉 thought: true 的思考過程碎片，只取真正的回答文字
      const parts = d?.candidates?.[0]?.content?.parts || [];
      const answerText = parts
        .filter(p => !p.thought && typeof p.text === 'string')
        .map(p => p.text)
        .join('')
        .trim();

      if (!answerText) throw new Error(`${modelName}: 返回內容為空`);
      return { model: modelName, text: answerText };
    }

    // 3. 多模型並發競速：誰先在 0.5 秒內算完，立刻顯示誰，並切斷其他慢的模型！
    async function runFastAI() {
      const promptText = document.getElementById('promptInput').value.trim();
      if (!promptText) return;

      if (!savedApiKey) {
        document.getElementById('answerOutput').innerText = '⚠️ 請先在上方貼入您的 Google Gemini API Key 並點擊「儲存並測試」。';
        return;
      }

      if (availableFlashModels.length === 0) {
        await loadAvailableModels(savedApiKey);
      }

      const outEl = document.getElementById('answerOutput');
      const tagEl = document.getElementById('activeEngineTag');
      tagEl.style.display = 'none';
      outEl.innerText = '⚡ 多模型極速競速中...';

      const selectedMode = document.getElementById('modelSelect').value;
      const modelsToRace = selectedMode === 'AUTO_RACE'
        ? availableFlashModels.slice(0, 3)
        : [selectedMode];

      const t0 = performance.now();
      logMsg(`🏁 同時向 [${modelsToRace.join(', ')}] 發起極速競速請求...`);

      const controllers = modelsToRace.map(() => new AbortController());

      const racePromises = modelsToRace.map((mName, idx) =>
        callSingleModelFast(mName, promptText, controllers[idx].signal)
          .then(res => {
            // 一旦有一個模型獲勝，立即中止其他還在跑的慢模型
            controllers.forEach((c, i) => { if (i !== idx) c.abort(); });
            return res;
          })
          .catch(err => {
            if (err.name !== 'AbortError') {
              logMsg(`⚠️ ${err.message}`);
            }
            throw err;
          })
      );

      try {
        const winner = await Promise.any(racePromises);
        const elapsed = Math.round(performance.now() - t0);
        tagEl.style.display = 'inline-block';
        tagEl.innerText = `🏆 獲勝模型: ${winner.model} · 總耗時 ${elapsed} ms`;
        outEl.innerText = winner.text;
        logMsg(`🏆 [${winner.model}] 率先返回結果！總耗時: ${elapsed} ms`);
      } catch (aggErr) {
        outEl.innerText = '❌ 所有模型請求皆失敗，請查看下方黑色日誌框的具体報錯原因。';
        logMsg('❌ 競速全部失敗，請檢查 API Key 額度或網路連線。');
      }
    }

    // 4. 免 Key 跳轉瀏覽器 Gemini（加上防抖鎖，避免重複觸發 4 次）
    async function askViaBrowserTab() {
      const q = document.getElementById('promptInput').value.trim();
      if (!q) return;
      try { await navigator.clipboard.writeText(q); } catch (e) {}
      waitingRelay = true;
      document.getElementById('answerOutput').innerText =
        '📋 問題已複製！請在彈出的 Google Gemini 視窗貼上提問，複製回答後切回本頁即可。';
      logMsg('等待從瀏覽器 Gemini 複製回答切回...');
      window.open('https://gemini.google.com/app', '_blank');
    }

    window.addEventListener('focus', async () => {
      if (!waitingRelay) return;
      waitingRelay = false; // 立即上鎖，防止連續觸發 4 次
      try {
        const clip = (await navigator.clipboard.readText() || '').trim();
        const originalQ = document.getElementById('promptInput').value.trim();
        if (clip && clip !== originalQ) {
          const tagEl = document.getElementById('activeEngineTag');
          tagEl.style.display = 'inline-block';
          tagEl.innerText = '⚡ 來自瀏覽器 Gemini 剪貼簿接回';
          document.getElementById('answerOutput').innerText = clip;
          logMsg('✅ 已成功從剪貼簿接回回答！');
        } else {
          waitingRelay = true; // 若還沒複製新答案，保持等待
        }
      } catch (e) {}
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume 1 Vocabulary List</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #4CAF50;
            font-size: 32px;
            margin-bottom: 10px;
        }
        .download-link {
            color: #b39ddb;
            text-decoration: none;
            font-size: 16px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .download-link:hover {
            text-decoration: underline;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 160px;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #4CAF50;
            background-color: #252525;
        }
        .chinese {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .english {
            font-size: 16px;
            color: #aaaaaa;
            font-style: italic;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .audio-btn {
            font-size: 13px;
            color: #888888;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .card:hover .audio-btn {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <h1>Volume 1 Vocabulary List</h1>
    <a href="Easy_Mandarin_Speaking_Trees_Pinyin_Book_1.apkg" class="download-link">📩 Download Anki Flashcards Deck</a>

    <div class="grid-container" id="grid"></div>

    <script>
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        async function loadCards() {
            try {
                const response = await fetch('words.csv');
                if (!response.ok) {
                    document.getElementById('grid').innerHTML = '<p style="color:red;">Error: words.csv not found.</p>';
                    return;
                }
                const text = await response.text();
                const lines = text.split(/\r?\n/);
                const grid = document.getElementById('grid');
                
                let audioIndex = 0;

                lines.forEach((line) => {
                    if (!line.trim()) return;
                    
                    const parts = parseCSVLine(line);
                    if (parts.length < 2) return;
                    
                    audioIndex++; 
                    
                    const english = parts[0]; // A栏英文
                    const chinese = parts[1]; // B栏中文
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // 点击卡片：只播放中文发音
                    card.onclick = () => {
                        const audio = new Audio('audio/' + audioIndex + '.mp3');
                        audio.play();
                    };

                    // 卡片内容：同时塞入了中文汉字和英文翻译，底部是 Click to Listen
                    card.innerHTML = `
                        <div class="chinese">${chinese}</div>
                        <div class="english">${english}</div>
                        <div class="audio-btn">Click to Listen 🔊</div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Failed to load list:', error);
            }
        }

        window.onload = loadCards;
    </script>
</body>
</html>

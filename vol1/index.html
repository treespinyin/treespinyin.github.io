<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume 1 Vocabulary List</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .back-link {
            color: #888888;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            align-self: flex-start;
        }
        .back-link:hover { color: #ffffff; }
        h1 {
            color: #4CAF50;
            font-size: 32px;
            margin-bottom: 10px;
        }
        .download-link {
            color: #b39ddb;
            text-decoration: none;
            font-size: 16px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .download-link:hover { text-decoration: underline; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 160px;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #4CAF50;
            background-color: #252525;
        }
        .chinese {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .english {
            font-size: 16px;
            color: #aaaaaa;
            font-style: italic;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .audio-btn {
            font-size: 13px;
            color: #888888;
        }
        .card:hover .audio-btn { color: #ffffff; }
    </style>
</head>
<body>

    <a href="../index.html" class="back-link">← Back to Volumes</a>
    <h1>Volume 1 Vocabulary List</h1>
    <a href="../Easy_Mandarin_Speaking_Trees_Pinyin_Book_1.apkg" class="download-link">📩 Download Anki Flashcards Deck</a>

    <div class="grid-container" id="grid"></div>

    <script>
        // ==========================================
        // 🛠️ 2. 【数据舱：已为您完整补齐“一”以及修复“万”之后的数据】
        // 如果你后续还有更多单词，按相同格式（英文 + Tab键 + 中文）往下粘贴即可
        // ==========================================
        const rawSheetData = `One (1)	一
Two (2)	二
Three (3)	三
Four (4)	四
Five (5)	五
Six (6)	六
Seven (7)	七
Eight (8)	八
Nine (9)	九
Ten (10)	十
Hundred (100)	百
Thousand (1,000)	千
Ten thousand (10,000)	万
One hundred million (100,000,000)	亿
Trillion (1,000,000,000,000)	万亿`;
        // ==========================================

        function loadCardsDirectly() {
            const grid = document.getElementById('grid');
            const lines = rawSheetData.split('\n');
            let audioIndex = 0;

            lines.forEach(line => {
                if (!line.trim()) return;
                
                // 3. 【算法升级】优先使用 Tab(制表符) 进行切分，完美绕过英文数字里的逗号干扰！
                let parts = [];
                if (line.includes('\t')) {
                    parts = line.split('\t');
                } else {
                    // 如果没有Tab，则智能寻找最后一个逗号进行切分
                    const lastComma = line.lastIndexOf(',');
                    if (lastComma !== -1) {
                        parts = [line.substring(0, lastComma), line.substring(lastComma + 1)];
                    } else {
                        parts = [line];
                    }
                }
                
                if (parts.length < 2) return;

                audioIndex++;
                const english = parts[0].trim().replace(/^"|"$/g, '');
                const chinese = parts[1].trim().replace(/^"|"$/g, '');

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => {
                    const audio = new Audio('audio/' + audioIndex + '.mp3');
                    audio.play().catch(err => console.log("Audio file missing:", audioIndex, err));
                };

                card.innerHTML = `
                    <div class="chinese">${chinese}</div>
                    <div class="english">${english}</div>
                    <div class="audio-btn">Click to Listen 🔊</div>
                `;
                grid.appendChild(card);
            });
        }

        window.onload = loadCardsDirectly;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trees Pinyin — 極簡谷歌膠囊 AI 問答測試版</title>
  <meta name="theme-color" content="#1b5e20">
  <link rel="icon" type="image/png" href="/icon.png?v=3">

  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #111827;
      --muted: #64748b;
      --accent: #1b5e20;
      --accent-hover: #2e7d32;
      --accent-soft: #e8f5e9;
      --blue: #1a73e8;
      --border: #dfe1e5;
      --danger: #d93025;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 28px 16px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* 1. 頂部版本時間與快速狀態列 (方便測試確認版本) */
    .top-meta-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 6px;
    }
    .build-time-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e8f5e9;
      color: #1b5e20;
      border: 1px solid #a5d6a7;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .top-right-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mini-pill-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .mini-pill-btn:hover { background: #f1f5f9; border-color: #94a3b8; }
    .mini-pill-btn.active-mode {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .mini-pill-btn.has-key {
      background: #e8f5e9;
      color: #1b5e20;
      border-color: #2e7d32;
    }

    /* 2. 谷歌風格大膠囊搜索框 (Google Pill Search Bar) */
    .google-capsule-wrap {
      width: 100%;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 32px;
      padding: 8px 10px 8px 20px;
      box-shadow: 0 2px 8px rgba(32, 33, 36, 0.08);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .google-capsule-wrap:focus-within {
      border-color: #1b5e20;
      box-shadow: 0 4px 16px rgba(27, 94, 32, 0.16);
    }
    .capsule-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1.05rem;
      line-height: 1.45;
      color: var(--text);
      background: transparent;
      font-family: inherit;
      resize: none;
      max-height: 110px;
      padding: 4px 0;
    }
    .capsule-input::placeholder { color: #9aa0a6; }

    .capsule-icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #5f6368;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    .capsule-icon-btn:hover { background: #f1f3f4; color: #202124; }
    .capsule-icon-btn:active { transform: scale(0.95); }
    .capsule-icon-btn svg { width: 22px; height: 22px; fill: currentColor; }

    /* 語音按鈕動態效果 */
    .capsule-icon-btn.mic-btn {
      background: #f1f5f9;
      color: #1a73e8;
    }
    .capsule-icon-btn.mic-btn.recording {
      background: var(--danger);
      color: #ffffff;
      animation: micPulse 1s infinite;
    }
    @keyframes micPulse {
      0% { box-shadow: 0 0 0 0 rgba(217, 48, 37, 0.45); }
      70% { box-shadow: 0 0 0 10px rgba(217, 48, 37, 0); }
      100% { box-shadow: 0 0 0 0 rgba(217, 48, 37, 0); }
    }

    /* 發送/AI 問答按鈕 */
    .capsule-send-btn {
      height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .capsule-send-btn:hover { background: var(--accent-hover); }

    /* 語音即時聽寫與候選詞包容度條 (可點擊一鍵切換同音候選詞) */
    .voice-live-bar {
      width: 100%;
      display: none;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 14px;
      font-size: 0.82rem;
      color: #92400e;
    }
    .voice-alt-chip {
      background: #ffffff;
      border: 1px solid #fcd34d;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #1f2937;
      cursor: pointer;
      transition: all 0.12s;
    }
    .voice-alt-chip:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* 3. AI 回答與四位一體注音卡片 */
    .answer-card {
      width: 100%;
      background: var(--card);
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.03);
      padding: 18px 20px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      --user-font-size: 20px;
    }

    .status-banner {
      width: 100%;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.92rem;
      font-weight: 600;
      color: #166534;
      display: none;
    }

    .annotation-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .sentence-block {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding-bottom: 14px;
      border-bottom: 1px dashed #e5e7eb;
    }
    .sentence-block:last-child { border-bottom: none; padding-bottom: 0; }

    .en-line {
      font-size: calc(var(--user-font-size) * 0.92);
      font-weight: 600;
      color: #1f2937;
      line-height: 1.42;
      max-width: 96%;
    }
    .char-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 0;
      align-items: flex-end;
    }
    .tp-col {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      margin: 0 0.28ch;
      cursor: pointer;
      padding: 2px 3px;
      border-radius: 6px;
      transition: background 0.12s;
    }
    .tp-col:hover { background: #f1f8e9; }
    .tp-py {
      font-size: calc(var(--user-font-size) * 0.96);
      font-weight: 700;
      font-style: italic;
      color: #1b5e20;
      line-height: 1.16;
      white-space: nowrap;
    }
    .tp-std {
      font-size: calc(var(--user-font-size) * 0.78);
      font-weight: 500;
      color: #6b7280;
      line-height: 1.15;
      white-space: nowrap;
    }
    .tp-zh {
      font-size: calc(var(--user-font-size) * 1.25);
      font-weight: 600;
      color: #000000;
      line-height: 1.22;
      min-height: 1.22em;
    }

    /* API Key 彈窗 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 410px;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- 🕒 1. 膠囊上方：顯示檔案建設時間 + 語音聲道切換 + API Key 狀態 (方便測試) -->
    <div class="top-meta-bar">
      <div class="build-time-badge">
        <span>🕒 檔案建設時間 (Build): 2026-11-13 16:50 PST (v2.0 高包容語音版)</span>
      </div>

      <div class="top-right-tools">
        <!-- 語音模式切換：支援「中英自動」、「中文優先」、「English 優先」 -->
        <button class="mini-pill-btn active-mode" id="voiceLangModeBtn" onclick="cycleVoiceLangMode()" title="切換語音識別語言重心">
          🎙️ 語音: 中/EN 自動
        </button>
        <button class="mini-pill-btn" id="speakAllBtn" onclick="speakAllDisplayed()">
          🔊 朗讀
        </button>
        <button class="mini-pill-btn" id="keyBtn" onclick="openKeyModal()">
          🔑 API Key
        </button>
      </div>
    </div>

    <!-- 🔍 2. 谷歌膠囊輸入框 (僅保留核心 AI 問答與高包容語音輸入) -->
    <div class="google-capsule-wrap">
      <textarea id="userInput" class="capsule-input" rows="1"
        placeholder="像谷歌一樣說中文或英文提問（例：背誦靜夜思 / How to order milk tea in Chinese?）..."
        oninput="autoResizeTextarea(this)"></textarea>

      <!-- 清空按鈕 -->
      <button class="capsule-icon-btn" id="clearBtn" onclick="clearCapsuleInput()" title="清空 (Clear)" style="display:none;">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>

      <!-- 谷歌風格麥克風按鈕 -->
      <button class="capsule-icon-btn mic-btn" id="micBtn" onclick="toggleVoice()" title="點擊開始語音輸入（支援中英文、停頓不中斷）">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
      </button>

      <!-- 提問按鈕 -->
      <button class="capsule-send-btn" onclick="runSmartAI()">
        ✨ AI 問答
      </button>
    </div>

    <!-- 💡 語音即時聽寫與多候選詞包容欄 (當識別出多個同音詞時，既交給 AI 自動選，也允許用戶一鍵點選) -->
    <div id="voiceLiveBar" class="voice-live-bar"></div>

    <!-- 📖 3. AI 回答與四位一體注音顯示區 -->
    <div class="answer-card" id="answerCard">
      <div id="statusBanner" class="status-banner"></div>
      <div id="annotationList" class="annotation-list"></div>
    </div>

  </div>

  <!-- 🔑 API Key 設置彈窗 -->
  <div class="modal" id="keyModal" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal-box">
      <h3 style="margin:0; font-size:1.02rem; color:var(--accent);">🔑 Google Gemini API Key</h3>
      <div style="font-size:0.84rem; line-height:1.55; background:#f8fafc; padding:12px; border-radius:10px; color:#334155;">
        預設已啟用 <b>Cloudflare 全球共享快取 + 多 Key 輪詢通道</b>。<br>
        您也可以填入個人的免費 Gemini API Key 獲得專屬無限極速通道：<br>
        <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:var(--blue); font-weight:700;">點此前往 Google AI Studio 免費獲取 ↗</a>
      </div>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy... (選填)" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; font-size:0.9rem;">
      <div style="display:flex; gap:8px;">
        <button class="capsule-send-btn" style="flex:1; justify-content:center;" onclick="saveBackupKey()">儲存並測試</button>
        <button class="mini-pill-btn" style="padding:0 16px;" onclick="clearBackupKey()">清除</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. 全域端點與萬人免費三級快取配置
    // =========================================================================
    const IS_LOCAL_FILE = window.location.protocol === 'file:';
    const CF_WORKER_ENDPOINTS = IS_LOCAL_FILE
      ? ['https://treespinyin-api.treespinyin.workers.dev', 'https://treespinyin.com/api']
      : ['https://treespinyin-api.treespinyin.workers.dev', '/api', 'https://treespinyin.com/api'];

    let openccToTrad = null;
    try {
      if (window.OpenCC) openccToTrad = window.OpenCC.Converter({ from: 'cn', to: 'tw' });
    } catch (e) {}

    function toTrad(str) {
      if (!str) return '';
      return openccToTrad ? openccToTrad(str) : str;
    }

    function autoResizeTextarea(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 110) + 'px';
      document.getElementById('clearBtn').style.display = el.value.length > 0 ? 'flex' : 'none';
    }

    function clearCapsuleInput() {
      const input = document.getElementById('userInput');
      input.value = '';
      autoResizeTextarea(input);
      document.getElementById('voiceLiveBar').style.display = 'none';
      input.focus();
    }

    document.getElementById('userInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        runSmartAI();
      }
    });

    // =========================================================================
    // 2. 🎙️ 高包容度谷歌膠囊語音輸入引擎
    //    為什麼剛才不準？因為：
    //    (1) 原版 2.5 秒一停頓就強制切斷，說話慢一點或思考一下後半句就被吞了；
    //    (2) 原版在拼接多個分句時覆蓋了候選詞，且英語母語者在 Safari/Edge 下被強制鎖在 zh-CN 會音譯成亂碼漢字。
    //    【全新升級】：
    //    - 支援「中/EN 自動」、「中文優先」、「English 優先」三檔＋首音節智慧偵測
    //    - 停頓容忍時間提升至 3.8 秒，且說話期間即時顯示聽寫進度與可點擊的同音候選詞膠囊
    //    - 擴大本地口音/古詩/日常高頻同音詞糾偏庫 + 完整保留多段候選詞交給 AI 語境還原
    // =========================================================================
    let activeRec = null;
    let voiceSilenceTimer = null;
    let voiceLangMode = 'auto'; // 'auto' | 'zh' | 'en'
    let latestVoiceCandidates = [];

    function cycleVoiceLangMode() {
      const btn = document.getElementById('voiceLangModeBtn');
      if (voiceLangMode === 'auto') {
        voiceLangMode = 'zh';
        btn.innerText = '🎙️ 語音: 中文優先';
      } else if (voiceLangMode === 'zh') {
        voiceLangMode = 'en';
        btn.innerText = '🎙️ 語音: English 優先';
      } else {
        voiceLangMode = 'auto';
        btn.innerText = '🎙️ 語音: 中/EN 自動';
      }
    }

    // 高包容度同音字與口音快速糾偏字典
    const FUZZY_VOICE_CORRECTIONS = [
      [/永和|泳鵝|泳鹅|勇鵝|勇鹅|擁鵝|拥鹅|用鵝|用鹅|詠俄|咏俄|影鵝|影鹅/g, '詠鵝'],
      [/今夜思|敬業思|敬业思|進夜思|进夜思|淨夜思|净夜思|經夜思|经夜思/g, '靜夜思'],
      [/春小|春笑|春校|純曉|纯晓|蠢小/g, '春曉'],
      [/登貫雀樓|登贯雀楼|登觀雀樓|登观雀楼|登冠雀樓|登冠雀楼/g, '登鸛雀樓'],
      [/水調歌頭|水调歌头|水掉歌頭|水掉歌头|水釣歌頭/g, '水調歌頭'],
      [/鹿柴|路窄|陸宅|陆宅|錄音帶|露寨/g, '鹿柴'],
      [/敏農|敏农|米農|米农|民農|民农/g, '憫農'],
      [/遊子音|游子音|油籽吟|由子吟/g, '遊子吟'],
      [/清明時節|親明時節|清明世界/g, '清明'],
      [/望廬山瀑布|望盧山瀑布|忘廬山瀑布/g, '望廬山瀑布']
    ];

    function applyFuzzyVoiceCorrection(rawTranscript, alts = []) {
      for (const a of alts) {
        if (/詠鵝|咏鹅|靜夜思|静夜思|春曉|春晓|登鸛雀樓|登鹳雀楼|水調歌頭|水调歌头|鹿柴|憫農|悯农|遊子吟|游子吟|望廬山瀑布/.test(a)) {
          return a.trim();
        }
      }
      let fixed = rawTranscript || '';
      for (const [pattern, replacement] of FUZZY_VOICE_CORRECTIONS) {
        fixed = fixed.replace(pattern, replacement);
      }
      return fixed.trim();
    }

    function renderVoiceCandidateChips(primaryText, candidates) {
      const bar = document.getElementById('voiceLiveBar');
      const unique = Array.from(new Set([primaryText, ...candidates].map(s => s.trim()).filter(Boolean))).slice(0, 5);
      if (unique.length <= 1) {
        bar.style.display = 'none';
        return;
      }
      bar.style.display = 'flex';
      bar.innerHTML = `<span>🎙️ 語音同音候選（AI 將自動甄別，也可點選）：</span>`;
      unique.forEach(cand => {
        const chip = document.createElement('button');
        chip.className = 'voice-alt-chip';
        chip.innerText = cand;
        chip.onclick = () => {
          document.getElementById('userInput').value = cand;
          autoResizeTextarea(document.getElementById('userInput'));
          runSmartAI(cand, unique);
        };
        bar.appendChild(chip);
      });
    }

    function toggleVoice() {
      const btn = document.getElementById('micBtn');
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        alert('請使用 Chrome、Edge 或 Safari 瀏覽器以支援語音輸入。');
        return;
      }

      // 如果正在錄音，再次點擊則立刻結束並發送提問
      if (activeRec) {
        clearTimeout(voiceSilenceTimer);
        activeRec.stop();
        return;
      }

      latestVoiceCandidates = [];
      activeRec = new SR();

      // 根據用戶選擇或瀏覽器環境設定最佳識別語言
      if (voiceLangMode === 'en') {
        activeRec.lang = 'en-US';
      } else if (voiceLangMode === 'zh') {
        activeRec.lang = 'zh-CN';
      } else {
        // auto 模式：zh-CN 聲學模型在 Chrome/Edge 原生兼顧國語與英語詞彙
        activeRec.lang = 'zh-CN';
      }

      activeRec.interimResults = true;
      activeRec.maxAlternatives = 5;
      activeRec.continuous = true;
      btn.classList.add('recording');

      const liveBar = document.getElementById('voiceLiveBar');
      liveBar.style.display = 'flex';
      liveBar.innerHTML = `<span>🔴 正在聆聽中（請直接說中文或英文，說完停頓即自動回答，或再次點擊麥克風結束）...</span>`;

      // 按段落保存，避免長句停頓時後一段覆蓋前一段的候選詞
      const segmentPrimary = [];
      const segmentAlts = [];

      function resetSilenceTimer() {
        clearTimeout(voiceSilenceTimer);
        // 包容度大幅提升：給用戶 3.8 秒思考與換氣停頓時間，不會說一半被切斷
        voiceSilenceTimer = setTimeout(() => {
          if (activeRec) activeRec.stop();
        }, 3800);
      }

      resetSilenceTimer();

      activeRec.onresult = (e) => {
        resetSilenceTimer();
        let interimText = '';

        for (let i = e.resultIndex; i < e.results.length; i++) {
          const res = e.results[i];
          const altsForThisSeg = [];
          for (let k = 0; k < res.length; k++) {
            const t = (res[k]?.transcript || '').trim();
            if (t) altsForThisSeg.push(t);
          }

          if (res.isFinal) {
            const bestSeg = applyFuzzyVoiceCorrection(res[0].transcript.trim(), altsForThisSeg);
            segmentPrimary[i] = bestSeg;
            segmentAlts[i] = altsForThisSeg;
          } else {
            interimText += res[0].transcript;
          }
        }

        const completedText = segmentPrimary.filter(Boolean).join(' ');
        const fullCurrentText = applyFuzzyVoiceCorrection((completedText + (interimText ? ' ' + interimText : '')).trim());

        // 組合完整的全句候選清單（最多保留前 5 個高機率完整句子）
        const combinedCandidates = new Set();
        if (fullCurrentText) combinedCandidates.add(fullCurrentText);
        for (let k = 0; k < 5; k++) {
          const altSentence = segmentAlts
            .map((arr, idx) => (arr && arr[k]) ? arr[k] : (segmentPrimary[idx] || ''))
            .filter(Boolean)
            .join(' ')
            .trim();
          if (altSentence) combinedCandidates.add(altSentence);
        }

        latestVoiceCandidates = Array.from(combinedCandidates).slice(0, 5);
        const inputEl = document.getElementById('userInput');
        inputEl.value = fullCurrentText;
        autoResizeTextarea(inputEl);
      };

      activeRec.onend = () => {
        clearTimeout(voiceSilenceTimer);
        btn.classList.remove('recording');
        activeRec = null;
        const spoken = document.getElementById('userInput').value.trim();
        if (spoken) {
          renderVoiceCandidateChips(spoken, latestVoiceCandidates);
          runSmartAI(spoken, latestVoiceCandidates);
        } else {
          liveBar.style.display = 'none';
        }
      };

      activeRec.onerror = () => {
        clearTimeout(voiceSilenceTimer);
        btn.classList.remove('recording');
        activeRec = null;
        liveBar.style.display = 'none';
      };

      activeRec.start();
    }

    const DIGITS_ZH = ['零','一','二','三','四','五','六','七','八','九'];

    function intToChinese(numStr) {
      let n = parseInt(numStr, 10);
      if (isNaN(n)) return numStr;
      if (n === 0) return '零';
      if (n < 0) return '負' + intToChinese(String(-n));
      if (numStr.length === 4 && n >= 1900 && n <= 2099) {
        return numStr.split('').map(d => DIGITS_ZH[parseInt(d, 10)]).join('');
      }
      if (n < 10) return DIGITS_ZH[n];
      if (n < 100) {
        let ten = Math.floor(n / 10), rem = n % 10;
        return (ten === 1 ? '十' : DIGITS_ZH[ten] + '十') + (rem > 0 ? DIGITS_ZH[rem] : '');
      }
      if (n < 1000) {
        let hun = Math.floor(n / 100), rem = n % 100;
        if (rem === 0) return DIGITS_ZH[hun] + '百';
        if (rem < 10) return DIGITS_ZH[hun] + '百零' + DIGITS_ZH[rem];
        return DIGITS_ZH[hun] + '百' + intToChinese(String(rem));
      }
      if (n < 10000) {
        let th = Math.floor(n / 1000), rem = n % 1000;
        if (rem === 0) return DIGITS_ZH[th] + '千';
        if (rem < 100) return DIGITS_ZH[th] + '千零' + intToChinese(String(rem));
        return DIGITS_ZH[th] + '千' + intToChinese(String(rem));
      }
      return numStr.split('').map(d => DIGITS_ZH[parseInt(d, 10)] || d).join('');
    }

    function numberToChinese(str) {
      if (str.includes('.')) {
        let parts = str.split('.');
        let intPart = intToChinese(parts[0] || '0');
        let decPart = parts[1].split('').map(d => DIGITS_ZH[parseInt(d, 10)]).join('');
        return intPart + '點' + decPart;
      }
      return intToChinese(str);
    }

    function expandNumbersAndSymbolsToZh(text) {
      if (!text) return '';
      let s = text;
      s = s.replace(/H2O/gi, '水').replace(/CO2/gi, '二氧化碳').replace(/O2/gi, '氧氣');
      s = s.replace(/Wi-?Fi/gi, '無線網路').replace(/APP/gi, '應用程式').replace(/AI/gi, '人工智慧');
      s = s.replace(/°C|℃/g, '攝氏度').replace(/°F|℉/g, '華氏度');
      s = s.replace(/(\d{1,2}):(\d{2})/g, (_, h, m) => intToChinese(h) + '點' + (m === '00' ? '整' : intToChinese(m) + '分'));
      s = s.replace(/(\d+(?:\.\d+)?)\s*%/g, (_, num) => '百分之' + numberToChinese(num));
      s = s.replace(/\$\s*(\d+(?:\.\d+)?)/g, (_, num) => numberToChinese(num) + '美元');
      s = s.replace(/[¥￥]\s*(\d+(?:\.\d+)?)/g, (_, num) => numberToChinese(num) + '元');
      s = s.replace(/\+/g, '加').replace(/=/g, '等於').replace(/&/g, '和');
      s = s.replace(/\d+(?:\.\d+)?/g, (match) => numberToChinese(match));
      return s;
    }

    function compileToTreesPinyin(pyNum) {
      if (!pyNum) return '';
      let m = pyNum.trim().match(/^([a-züv:]+)([0-5]?)$/i);
      if (!m) return pyNum;
      let syl = m[1].toLowerCase().replace('ü', 'v').replace('u:', 'v');
      let tone = m[2] || '';
      let mapped = '';
      if (syl === 'er') mapped = (tone === '4') ? 'uh-er' : '(uh)-er';
      else if (OVERALL_16[syl]) mapped = OVERALL_16[syl];
      else if (LOCKED_MAP[syl]) mapped = LOCKED_MAP[syl];
      else {
        let init = '', fin = syl;
        for (let l of ['zh', 'ch', 'sh']) { if (syl.startsWith(l)) { init = l; fin = syl.slice(2); break; } }
        if (!init && syl.length > 1 && 'bpmfdtnlgkhjqxzcsryw'.includes(syl[0])) { init = syl[0]; fin = syl.slice(1); }
        let mappedInit = INITIALS[init] || init;
        let mappedFin = FINALS[fin] || fin;
        if (mappedInit.endsWith('ee') && mappedFin.startsWith('ee')) mapped = mappedInit + mappedFin.slice(2);
        else if (mappedInit.endsWith('ee') && mappedFin.startsWith('i')) mapped = mappedInit.slice(0, -2) + mappedFin;
        else if (init === 'y' && mappedFin.startsWith('ee')) mapped = 'y' + mappedFin;
        else if (init === 'w' && mappedFin.startsWith('oo')) mapped = 'w' + mappedFin;
        else mapped = mappedInit + mappedFin;
      }
      let toneSuffix = (tone === '2' || tone === '3' || tone === '4') ? tone : '';
      return mapped + toneSuffix;
    }

    function numPinyinToToneMark(pyNum) {
      if (!pyNum) return '';
      const m = pyNum.trim().match(/^([a-züv:]+)([1-5]?)$/i);
      if (!m) return pyNum;
      let s = m[1].toLowerCase().replace('v', 'ü').replace('u:', 'ü');
      const t = parseInt(m[2] || '5', 10);
      if (t < 1 || t > 4) return s;
      const marks = { a:['ā','á','ǎ','à'], e:['ē','é','ě','è'], i:['ī','í','ǐ','ì'], o:['ō','ó','ǒ','ò'], u:['ū','ú','ǔ','ù'], ü:['ǖ','ǘ','ǚ','ǜ'] };
      if (s.includes('a')) return s.replace('a', marks.a[t-1]);
      if (s.includes('e')) return s.replace('e', marks.e[t-1]);
      if (s.includes('ou')) return s.replace('o', marks.o[t-1]);
      for (let i = s.length - 1; i >= 0; i--) { if (marks[s[i]]) return s.slice(0, i) + marks[s[i]][t-1] + s.slice(i + 1); }
      return s;
    }

    function getAccuratePinyinArray(zhText) {
      let pyArr = pinyinPro.pinyin(zhText, { type: 'array', toneType: 'num' });

        }
      }

    }

    async function discoverFastModels(key) {
      if (!key) return;
      try {
        const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
        if (!r.ok) return;
        const data = await r.json();
        const all = (data.models || [])
          .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
          .map(m => m.name.replace('models/', ''))
          .filter(n => !/tts|image|imagen|embedding|veo|robotics|aqa|bison|gecko/i.test(n));

        const priority = [
          'gemini-flash-latest',
          'gemini-2.5-flash',
          'gemini-3.5-flash',
          'gemini-flash-lite-latest',
          'gemini-2.0-flash'
        ];
        const sorted = [];
        for (const p of priority) {
          if (all.includes(p)) sorted.push(p);
        }
        for (const m of all) {
          if ((m.includes('flash') || m.includes('latest')) && !sorted.includes(m)) sorted.push(m);
        }
        if (sorted.length > 0) availableFastModels = sorted;
      } catch (e) {}
    }

    function fetchWithTimeout(url, options = {}, timeoutMs = 7500) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      return fetch(url, { ...options, signal: ctrl.signal }).finally(() => clearTimeout(timer));
    }

    async function callSingleGeminiModelFast(modelName, promptText, signal) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(backupKey)}`;
      let r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }],
          generationConfig: { temperature: 0.1, thinkingConfig: { thinkingBudget: 0 } }
        }),
        signal
      });

      if (r.status === 404) {
        discoverFastModels(backupKey);
        throw new Error('MODEL_RENAMED_404');
      }

      if (r.status === 400) {
        r = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: { temperature: 0.1 }
          }),
          signal
        });
      }

      const d = await r.json();
      if (!r.ok) throw new Error(d?.error?.message || `HTTP ${r.status}`);

      const resParts = d?.candidates?.[0]?.content?.parts || [];
      const text = resParts
        .filter(p => !p.thought && typeof p.text === 'string')
        .map(p => p.text)
        .join('')
        .trim();

      if (!text) throw new Error('EMPTY');
      return text;
    }

    // 階梯式順位調用：絕不同時群發浪費額度，省下 75% 免費配額供萬人使用
    async function fetchFastAccurateAI(promptText, rawQuestionForCache = '') {
      const cleanCacheKey = normalizeCacheKey(rawQuestionForCache);

      // 1. 若用戶填了自己的免費 Key，按順序調用主力模型，失敗才切換備用模型
      if (backupKey) {
        const modelsToTry = availableFastModels.slice(0, 3);
        for (let i = 0; i < modelsToTry.length; i++) {
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), i === 0 ? 4500 : 6500);
          try {
            const txt = await callSingleGeminiModelFast(modelsToTry[i], promptText, ctrl.signal);
            clearTimeout(timer);
            if (txt) return txt;
          } catch (e) {
            clearTimeout(timer);
          }
        }
      }

      // 2. 走 Cloudflare Worker 全球邊緣免費快取與多 Key 輪詢池
      for (let i = 0; i < CF_WORKER_ENDPOINTS.length; i++) {
        try {
          const r = await fetchWithTimeout(CF_WORKER_ENDPOINTS[i], {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              prompt: promptText,
              cacheKey: cleanCacheKey
            })
          }, 7000);
          if (!r.ok) continue;
          const d = await r.json();
          const t = (d?.text || d?.reply || d?.choices?.[0]?.message?.content || '').trim();
          if (t) return t;
        } catch (e) {}
      }

      return '';
    }

    function cleanChineseSentence(line) {
      if (!line) return '';
      let s = expandNumbersAndSymbolsToZh(line)
        .replace(/^[-*•\d.)、]+\s*/, '')
        .replace(/\*+/g, '')
        .replace(/\([^)]*[A-Za-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ][^)]*\)/g, '')
        .replace(/（[^）]*[A-Za-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ][^）]*）/g, '')
        .replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜA-Za-z]{2,}/g, '')
        .replace(/([，。！？；：、,.!?;:])\s*[，。！？；：、,.!?;:]+/g, '$1')
        .replace(/^[，。！？；：、,.!?;:\s]+/, '')
        .replace(/\s+/g, '')
        .trim();
      return /[一-龥]/.test(s) ? s : '';
    }

    function parseBilingualPairLine(rawLine) {
      const cleaned = rawLine.replace(/^[-*•\d.)、]+\s*/, '').replace(/\*+/g, '').trim();
      if (!cleaned.includes('|||')) return null;
      const parts = cleaned.split('|||').map(p => p.trim()).filter(Boolean);
      if (parts.length < 2) return null;

      let zhPart = '', enPart = '';
      if (/[一-龥]/.test(parts[0]) && !/[一-龥]/.test(parts[1])) {
        zhPart = cleanChineseSentence(parts[0]) || parts[0];
        enPart = parts[1];
      } else if (/[一-龥]/.test(parts[1])) {
        enPart = parts[0];
        zhPart = cleanChineseSentence(parts[1]) || parts[1];
      } else {
        zhPart = cleanChineseSentence(parts[0]) || parts[0];
        enPart = parts[1];
      }
      if (!/[一-龥]/.test(zhPart)) return null;
      return { zh: zhPart, en: enPart };
    }

    async function renderBilingualAIOutput(aiText) {
      const banner = document.getElementById('statusBanner');
      banner.style.display = 'none';
      const rawLines = aiText.split(/
+/).map(l => l.trim()).filter(Boolean);
      if (rawLines.length === 0) return false;

      const seenExactZh = new Set();
      let renderedPairs = 0;

      for (const rawLine of rawLines) {
        const pair = parseBilingualPairLine(rawLine);
        if (pair) {
          const key = pair.zh.replace(/[^一-龥]/g, '');
          if (!key || seenExactZh.has(key)) continue;
          seenExactZh.add(key);
          renderedPairs++;
          appendSentenceProgressive(pair.zh, pair.en);
          await nextPaintTick();
        } else {
          const lineStr = rawLine.replace(/^[-*•\d.)、]+\s*/, '').replace(/\*+/g, '').trim();
          const parenMatch = lineStr.match(/^(.+?)\s*[(（]([A-Za-z][^）)]+)[)）]$/);
          let zhStr = '', enStr = '';
          if (parenMatch && /[一-龥]/.test(parenMatch[1])) {
            zhStr = cleanChineseSentence(parenMatch[1]) || parenMatch[1].trim();
            enStr = parenMatch[2].trim();
          } else {
            zhStr = cleanChineseSentence(lineStr);
          }
          if (zhStr) {
            const key = zhStr.replace(/[^一-龥]/g, '');
            if (!key || seenExactZh.has(key)) continue;
            seenExactZh.add(key);
            renderedPairs++;
            appendSentenceProgressive(zhStr, enStr);
            await nextPaintTick();
          }
        }
      }
      return renderedPairs > 0;
    }

    async function runSmartAI(overrideInput, voiceAlts = []) {
      const rawText = (overrideInput !== undefined ? overrideInput : document.getElementById('userInput').value).trim();
      const altsToUse = (Array.isArray(voiceAlts) && voiceAlts.length > 0) ? voiceAlts : latestVoiceCandidates;
      const q = applyFuzzyVoiceCorrection(rawText, altsToUse);
      if (!q) return;

      const inputEl = document.getElementById('userInput');
      inputEl.value = q;
      autoResizeTextarea(inputEl);

      const banner = document.getElementById('statusBanner');
      const list = document.getElementById('annotationList');
      banner.style.display = 'block';
      banner.innerText = '⚡ AI 正在極速思考並生成雙語注音...';
      list.innerHTML = '';

      // 1. 優先命中本地快取 (0毫秒極速返回)
      const localHit = getLocalCachedAnswer(q);
      if (localHit) {
        const ok = await renderBilingualAIOutput(localHit);
        if (ok) return;
      }

      // 2. 將語音識別的所有同音候選詞一併交給 AI，讓 AI 自動糾正口音、同音字或中英混輸誤判
      const voiceCandidatesHint = (altsToUse && altsToUse.length > 1)
        ? `
Voice Speech-to-Text Candidates: ${JSON.stringify(altsToUse)}. (IMPORTANT: If the primary text has homophone typos or garbled Chinese phonetic characters from spoken English, pick or reconstruct the most semantically natural Mandarin or English question!)`
        : '';

      const directPrompt = `You are an authoritative bilingual scholar and assistant.
User question/request: "${q}"${voiceCandidatesHint}

CRITICAL ACCURACY RULES:
1. High Voice Tolerance: If the user's input has a voice-recognition homophone typo (e.g., "永和" instead of "詠鵝", "路窄" instead of "鹿柴", or phonetic Chinese characters representing spoken English words), automatically answer the intended topic accurately.
2. Formulate the complete, authoritative standard answer or authentic classic text:
   - If the user asks about a Chinese poem/classic (e.g., 詠鵝, 靜夜思, 水調歌頭, 鹿柴): Output ONLY the Title+Author on Line 1, followed by the COMPLETE original verses. No extra commentary!
   - If the user asks any other question in English or Chinese: Output a clear, complete, accurate bilingual answer.
3. Output Format (Every single line MUST use "|||"):
   - Line 1: Chinese_Title_or_Summary ||| English_Title_or_Summary
   - Line 2+: Pure_Chinese_Sentence ||| Authentic_English_Sentence
   - IMPORTANT: Left side of "|||" must contain ONLY Traditional Chinese characters and Chinese punctuation (write all numbers/terms in Chinese characters, NO Pinyin, NO English letters on the left side). Never repeat any line.`;

      const aiText = await fetchFastAccurateAI(directPrompt, q);
      if (aiText) {
        const ok = await renderBilingualAIOutput(aiText);
        if (ok) {
          saveLocalCachedAnswer(q, aiText);
          return;
        }
      }

      banner.innerHTML = `💡 當前公共免費通道繁忙，請點擊右上角 <b>[🔑 API Key]</b> 填入您免費的個人 Google Gemini Key 即可無限極速問答。`;
      openKeyModal();
    }

    // 預設載入一組示範，方便打開頁面立即看到效果
    window.addEventListener('DOMContentLoaded', () => {
      appendSentenceProgressive('請問你想向人工智慧提問什麼問題？', 'What question would you like to ask AI today?');
    });

    function openKeyModal() {
      document.getElementById('apiKeyInput').value = backupKey;
      document.getElementById('keyModal').style.display = 'flex';
    }
    async function saveBackupKey() {
      backupKey = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('tp_v22_backup_key', backupKey);
      refreshKeyBtnStyle();
      document.getElementById('keyModal').style.display = 'none';
      if (backupKey) {
        await discoverFastModels(backupKey);
        const pendingQ = document.getElementById('userInput').value.trim();
        if (pendingQ) runSmartAI(pendingQ);
      }
    }
    function clearBackupKey() {
      backupKey = '';
      localStorage.removeItem('tp_v22_backup_key');
      document.getElementById('apiKeyInput').value = '';
      refreshKeyBtnStyle();
    }
  </script>

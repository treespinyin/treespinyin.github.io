<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trees Pinyin - Learning Navigation</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            color: #4CAF50;
            font-size: 48px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #aaaaaa;
            font-size: 20px;
            margin-bottom: 50px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1000px;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover:not(.disabled) {
            transform: translateY(-5px);
            border-color: #4CAF50;
            background-color: #252525;
        }
        .card h2 {
            color: #4CAF50;
            margin: 0 0 15px 0;
            font-size: 28px;
        }
        .card p {
            color: #888888;
            font-size: 16px;
            margin: 0;
            line-height: 1.5;
        }
        .disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>treespinyin</h1>
    <div class="subtitle">Read Chinese Like English</div>

    <div class="grid-container">
        <a href="vol1/index.html" class="card">
            <h2>Volume 1</h2>
            <p>Essential Vocabulary & Audio Practice<br>(200+ Words & Sentences)</p>
        </a>

        <div class="card disabled">
            <h2>Volume 2</h2>
            <p>Coming Soon</p>
        </div>

        <div class="card disabled">
            <h2>Volume 3</h2>
            <p>Coming Soon</p>
        </div>
    </div>

</body>
</html>
